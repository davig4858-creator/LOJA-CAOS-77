<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ LOJA CAOS 77 — ACESSO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

:root{
  --bg: #050508;--fundo: #0F111A;--card: #171A2C;
  --primaria: #7C3AED;--primariaHover: #6D28D9;
  --texto: #F8FAFC;--textoSec: #94A3B8;--borda: rgba(124,58,237,0.25);
  --sombra: 0 8px 32px rgba(0,0,0,0.4);
}

body{
  background: linear-gradient(135deg,var(--bg),var(--fundo));
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--texto);
}

.caixa-login{
  background:var(--card);
  border:1px solid var(--borda);
  border-radius:24px;
  padding:48px 36px;
  width:90%;
  max-width:440px;
  text-align:center;
  box-shadow:var(--sombra);
  animation:aparecer 0.5s ease;
}

@keyframes aparecer{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

.caixa-login h1{
  font-size:32px;
  font-weight:900;
  margin-bottom:8px;
  letter-spacing:-0.5px;
}

.caixa-login h1 span{
  color:var(--primaria);
  text-shadow:0 0 20px rgba(124,58,237,0.5);
}

.caixa-login p{
  color:var(--textoSec);
  font-size:15px;
  margin-bottom:36px;
}

.caixa-login input{
  width:100%;
  padding:16px 18px;
  background:var(--fundo);
  border:1px solid var(--borda);
  border-radius:12px;
  color:var(--texto);
  font-size:16px;
  margin-bottom:18px;
  outline:none;
  transition:border 0.2s, box-shadow 0.2s;
}

.caixa-login input:focus{
  border-color:var(--primaria);
  box-shadow:0 0 0 3px rgba(124,58,237,0.15);
}

.btn-login{
  width:100%;
  padding:16px;
  background:linear-gradient(90deg,var(--primaria),#8B5CF6);
  border:none;
  border-radius:12px;
  color:white;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  margin-bottom:12px;
  transition:all 0.2s;
}

.btn-login:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(124,58,237,0.35);
}

.btn-visita{
  width:100%;
  padding:14px;
  background:transparent;
  border:1px solid var(--textoSec);
  border-radius:12px;
  color:var(--textoSec);
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:all 0.2s;
}

.btn-visita:hover{
  border-color:var(--primaria);
  color:var(--primaria);
  background:rgba(124,58,237,0.05);
}

.dica-senha{
  font-size:12px;
  color:var(--textoSec);
  margin-top:24px;
  padding-top:20px;
  border-top:1px solid rgba(255,255,255,0.05);
  line-height:1.8;
}

.dica-senha strong{
  color:var(--primaria);
}

.aviso{
  margin-top:16px;
  font-size:11px;
  color:var(--textoSec);
  opacity:0.7;
}
</style>
</head>
<body>

<div class="caixa-login">
  <h1>⚡ <span>LOJA CAOS 77</span></h1>
  <p>Sistema de Controle de Produção e Pagamentos</p>
  
  <input type="password" id="senhaLogin" placeholder="🔑 Senha de Administrador">
  
  <button class="btn-login" onclick="fazerLogin()">🔐 ENTRAR COMO ADMIN</button>
  <button class="btn-visita" onclick="fazerVisita()">👀 ENTRAR COMO VISITANTE</button>
  
  <div class="dica-senha">
    💡 <strong>Senha de Admin:</strong> 123477<br>
    👀 <strong>Visitante:</strong> Sem senha — apenas visualização
  </div>
  <div class="aviso">
    Os dados ficam salvos no próprio navegador
  </div>
</div>

<script>
const SENHA_ADMIN = '123477';

function fazerLogin() {
  const senha = document.getElementById('senhaLogin').value;
  if (senha === SENHA_ADMIN) {
    localStorage.setItem('caos77_acesso', 'admin');
    window.location.href = 'controle.html';
  } else {
    alert('❌ Senha incorreta! Tente novamente.');
    document.getElementById('senhaLogin').value = '';
  }
}

function fazerVisita() {
  localStorage.setItem('caos77_acesso', 'visitante');
  window.location.href = 'controle.html';
}

// Enter para logar
document.getElementById('senhaLogin').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') fazerLogin();
});
</script>

</body>
</html>
