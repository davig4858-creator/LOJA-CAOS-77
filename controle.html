<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOJA CAOS 77 — Controle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body {
            background: #0a0a0a;
            min-height: 100vh;
            color: #e5e5e5;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        h1 {
            color: #ff0000;
            font-size: 26px;
            letter-spacing: 2px;
        }
        .btn-sair {
            background: #2a2a2a;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-sair:hover { background: #444; }
        .cards-top {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .card {
            background: #171717;
            padding: 20px;
            border-radius: 10px;
            border-left: 3px solid #ff0000;
        }
        .card h3 {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 8px;
        }
        .card .valor {
            font-size: 22px;
            font-weight: bold;
            color: #00ff88;
        }
        .card .valor-amarelo { color: #ffcc00; }
        .section {
            background: #171717;
            padding: 22px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .section h2 {
            color: #ff4444;
            margin-bottom: 15px;
            font-size: 17px;
            padding-bottom: 8px;
            border-bottom: 1px solid #333;
        }
 table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 11px 10px;
            text-align: left;
            border-bottom: 1px solid #2a2a2a;
            font-size: 14px;
        }
        th {
            background: #1f1f1f;
            color: #ff6666;
            font-size: 13px;
        }
        tr:hover { background: #1e1e1e; }
        input {
            background: #242424;
            border: 1px solid #444;
            color: white;
            padding: 7px 10px;
            border-radius: 4px;
            font-size: 14px;
            width: 120px;
        }
        button {
            background: linear-gradient(90deg, #8b0000, #ff0000);
            border: none;
            color: white;
            padding: 7px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        button:hover { opacity: 0.9; }
        button.pequeno { padding: 4px 8px; font-size: 12px; margin-left: 4px; }
        button.cinza { background: #444; }
        .linha-acao {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .dia {
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .dia-G { background: #00ff88; color: #000; }
        .dia-Y { background: #ffcc00; color: #000; }
        .dia- { background: #2a2a2a; color: #777; }
        .ranking-badge {
            background: linear-gradient(90deg, #ffd700, #ffaa00);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
        }
        .escondido { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💀 LOJA CAOS 77 — CONTROLE</h1>
            <button class="btn-sair" onclick="sair()">🚪 Sair</button>
        </div>

        <!-- CARDS TOPO -->
        <div class="cards-top">
            <div class="card">
                <h3>💰 CAIXA DA FACÇÃO</h3>
                <div class="valor" id="caixa">R$ 0,00</div>
                <div class="linha-acao">
                    <input type="number" id="inpCaixa" placeholder="Valor">
                    <button onclick="salvarCaixa()">Salvar</button>
                </div>
            </div>
            <div class="card">
                <h3>💎 ESTOQUE DE FRAGMENTOS</h3>
                <div class="valor" id="estoque">0</div>
                <div class="linha-acao">
                    <input type="number" id="inpEstoque" placeholder="Qtd">
                    <button onclick="salvarEstoque()">Salvar</button>
                </div>
            </div>
            <div class="card">
                <h3>💲 VALOR POR FRAGMENTO</h3>
                <div class="valor valor-amarelo" id="preco">R$ 0,00</div>
                <div class="linha-acao">
                    <input type="number" id="inpPreco" placeholder="R$">
                    <button onclick="salvarPreco()">Salvar</button>
                </div>
            </div>
            <div class="card">
                <h3>🏆 TOP PRODUTOR DO DIA</h3>
                <div class="ranking-badge" id="topProd">—</div>
            </div>
        </div>

        <!-- TABELA DE MEMBROS -->
        <div class="section">
            <h2>📋 LISTA DE MEMBROS</h2>
            <table>
                <thead>
                    <tr>
                        <th>NOME</th>
                        <th>SEG</th>
                        <th>TER</th>
                        <th>QUA</th>
                        <th>QUI</th>
                        <th>SEX</th>
                        <th>SÁB</th>
                        <th>DOM</th>
                        <th style="width: 80px;">AÇÕES</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo">
                    <!-- PREENCHIDO PELO JS -->
                </tbody>
            </table>
            <div class="linha-acao">
                <input type="text" id="novoNome" placeholder="Nome do membro">
                <button onclick="adicionarMembro()">➕ Adicionar</button>
            </div>
        </div>

        <!-- MOVIMENTAÇÃO -->
        <div class="section">
            <h2>📊 MOVIMENTAÇÃO DO DIA</h2>
            <table>
                <thead>
                    <tr>
                        <th>DESCRIÇÃO</th>
                        <th>QTD</th>
                        <th>VALOR</th>
                        <th style="width: 80px;">AÇÃO</th>
                    </tr>
                </thead>
                <tbody id="mov-corpo">
                    <tr><td colspan="4" style="text-align:center; color:#777; padding:20px;">Sem registros</td></tr>
                </tbody>
            </table>
            <div class="linha-acao">
                <input type="text" id="movDesc" placeholder="Descrição" style="width:220px;">
                <input type="number" id="movQtd" placeholder="Qtd" style="width:70px;">
                <input type="number" id="movVal" placeholder="R$" style="width:100px;">
                <button onclick="adicionarMov()">➕ Adicionar</button>
            </div>
        </div>
    </div>

    <script>
        // VERIFICAR LOGIN
        const usuario = localStorage.getItem('usuario');
        const permissao = localStorage.getItem('permissao');
        if (!usuario) { window.location.href = 'index.html'; }

        // DADOS — TUDO IGUAL, SEM OS NÚMEROS DE PRODUÇÃO
        let dados = JSON.parse(localStorage.getItem('caos77_dados')) || {
            caixa: 0,
            estoque: 0,
            precoUnidade: 0,
            membros: [
                {nome: 'Sr Bristow', ehLider: true, dias: { seg:['G',''], ter:['Y',''], qua:['',''], qui:['',''], sex:['',''], sab:['',''], dom:['',''] }},
                {nome: 'Katy Bristow', ehLider: true, dias: { seg:['G',''], ter:['G',''], qua:['',''], qui:['',''], sex:['',''], sab:['',''], dom:['',''] }},
                {nome: 'Andres Bristow', ehLider: true, dias: { seg:['',''], ter:['',''], qua:['',''], qui:['',''], sex:['',''], sab:['',''], dom:['',''] }},
                {nome: 'Ferrari Bristow', ehLider: false, dias: { seg:['',''], ter:['',''], qua:['',''], qui:['',''], sex:['',''], sab:['',''], dom:['',''] }},
                {nome: 'Vn Bristow', ehLider: false, dias: { seg:['',''], ter:['',''], qua:['',''], qui:['',''], sex:['',''], sab:['',''], dom:['',''] }},
                {nome: 'Patrik Bristow', ehLider: false, dias: { seg:['',''], ter:['',''], qua:['',''], qui:['',''], sex:['',''], sab:['',''], dom:['',''] }},
                {nome: 'Garcia Bristow', ehLider: false, dias: { seg:['',''], ter:['',''], qua:['',''], qui:['',''], sex:['',''], sab:['',''], dom:['',''] }},
                {nome: 'Vt Bristow', ehLider: false, dias: { seg:['',''], ter:['',''], qua:['',''], qui:['',''], sex:['',''], sab:['',''], dom:['',''] }},
                {nome: 'Lula Bristow', ehLider: false, dias: { seg:['',''], ter:['',''], qua:['',''], qui:['',''], sex:['',''], sab:['',''], dom:['',''] }},
                {nome: 'Breck Bristow', ehLider: false, dias: { seg:['',''], ter:['',''], qua:['',''], qui:['',''], sex:['',''], sab:['',''], dom:['',''] }},
                {nome: 'Boladin Xt', ehLider: false, dias: { seg:['',''], ter:['',''], qua:['',''], qui:['',''], sex:['',''], sab:['',''], dom:['',''] }},
                {nome: 'Sr Ghostt', ehLider: false, dias: { seg:['',''], ter:['',''], qua:['',''], qui:['',''], sex:['',''], sab:['',''], dom:['',''] }},
                {nome: 'Laa Diabla', ehLider: false, dias: { seg:['',''], ter:['',''], qua:['',''], qui:['',''], sex:['',''], sab:['',''], dom:['',''] }},
                {nome: 'Ejuan Handi', ehLider: false, dias: { seg:['',''], ter:['',''], qua:['',''], qui:['',''], sex:['',''], sab:['',''], dom:['',''] }},
                {nome: 'Eduarda Faria', ehLider: false, dias: { seg:['',''], ter:['',''], qua:['',''], qui:['',''], sex:['',''], sab:['',''], dom:['',''] }},
                {nome: 'Mateus Faria', ehLider: false, dias: { seg:['',''], ter:['',''], qua:['',''], qui:['',''], sex:['',''], sab:['',''], dom:['',''] }},
                {nome: 'Zé Bagaceira', ehLider: false, dias: { seg:['',''], ter:['',''], qua:['',''], qui:['',''], sex:['',''], sab:['',''], dom:['',''] }},
                {nome: 'Alex Gadernal', ehLider: false, dias: { seg:['',''], ter:['',''], qua:['',''], qui:['',''], sex:['',''], sab:['',''], dom:['',''] }},
                {nome: 'Aquino Menezes', ehLider: false, dias: { seg:['',''], ter:['',''], qua:['',''], qui:['',''], sex:['',''], sab:['',''], dom:['',''] }},
                {nome: 'Connorr Dyygeras', ehLider: false, dias: { seg:['',''], ter:['',''], qua:['',''], qui:['',''], sex:['',''], sab:['',''], dom:['',''] }},
                {nome: 'Lanterna Preta', ehLider: false, dias: { seg:['',''], ter:['',''], qua:['',''], qui:['',''], sex:['',''], sab:['',''], dom:['',''] }}
            ],
            movimentacoes: []
        };

        function salvarDados() {
            localStorage.setItem('caos77_dados', JSON.stringify(dados));
            carregarTela();
        }

        function formatarDinheiro(valor) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor);
        }

        function carregarTela() {
            // CAIXA
            document.getElementById('caixa').textContent = formatarDinheiro(dados.caixa);
            // ESTOQUE
            document.getElementById('estoque').textContent = dados.estoque;
            // PREÇO
            document.getElementById('preco').textContent = formatarDinheiro(dados.precoUnidade);
            // TOP PRODUTOR
            document.getElementById('topProd').textContent = dados.membros.length > 0 ? dados.membros[0].nome : '—';

            // TABELA DE MEMBROS
            const corpo = document.getElementById('tabela-corpo');
            corpo.innerHTML = '';
            dados.membros.forEach((membro, index) => {
                corpo.innerHTML += `
                    <tr>
                        <td><strong>${membro.nome}</strong>${membro.ehLider ? ' ⭐' : ''}</td>
                        <td><span class="dia dia-${membro.dias.seg[0]}">${membro.dias.seg[0] || ''}</span></td>
                        <td><span class="dia dia-${membro.dias.ter[0]}">${membro.dias.ter[0] || ''}</span></td>
                        <td><span class="dia dia-${membro.dias.qua[0]}">${membro.dias.qua[0] || ''}</span></td>
                        <td><span class="dia dia-${membro.dias.qui[0]}">${membro.dias.qui[0] || ''}</span></td>
                        <td><span class="dia dia-${membro.dias.sex[0]}">${membro.dias.sex[0] || ''}</span></td>
                        <td><span class="dia dia-${membro.dias.sab[0]}">${membro.dias.sab[0] || ''}</span></td>
                        <td><span class="dia dia-${membro.dias.dom[0]}">${membro.dias.dom[0] || ''}</span></td>
                        <td>
                            ${permissao === 'admin' ? `
                                <button class="pequeno cinza" onclick="editarMembro(${index})">✏️</button>
                                <button class="pequeno cinza" onclick="removerMembro(${index})">🗑️</button>
                            ` : ''}
                        </td>
                    </tr>
                `;
            });

            // MOVIMENTAÇÕES
            const movCorpo = document.getElementById('mov-corpo');
            movCorpo.innerHTML = '';
            if (dados.movimentacoes.length === 0) {
                movCorpo.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#777; padding:20px;">Sem registros</td></tr>';
            } else {
                dados.movimentacoes.forEach((mov, index) => {
                    movCorpo.innerHTML += `
                        <tr>
                            <td>${mov.desc}</td>
                            <td>${mov.qtd}</td>
                            <td>${formatarDinheiro(mov.val)}</td>
                            <td>${permissao === 'admin' ? `<button class="pequeno cinza" onclick="removerMov(${index})">🗑️</button>` : ''}</td>
                        </tr>
                    `;
                });
            }
        }

        function salvarCaixa() {
            if (permissao !== 'admin') { alert('Sem permissão!'); return; }
            const val = parseFloat(document.getElementById('inpCaixa').value);
            if (!isNaN(val)) { dados.caixa = val; salvarDados(); document.getElementById('inpCaixa').value = ''; }
        }

        function salvarEstoque() {
            if (permissao !== 'admin') { alert('Sem permissão!'); return; }
            const val = parseInt(document.getElementById('inpEstoque').value);
            if (!isNaN(val)) { dados.estoque = val; salvarDados(); document.getElementById('inpEstoque').value = ''; }
        }

        function salvarPreco() {
            if (permissao !== 'admin') { alert('Sem permissão!'); return; }
            const val = parseFloat(document.getElementById('inpPreco').value);
            if (!isNaN(val)) { dados.precoUnidade = val; salvarDados(); document.getElementById('inpPreco').value = ''; }
        }

        function adicionarMembro() {
            if (permissao !== 'admin') { alert('Sem permissão!'); return; }
            const nome = document.getElementById('novoNome').value.trim();
            if (nome) {
                dados.membros.push({
                    nome: nome,
                    ehLider: false,
                    dias: { seg:['',''], ter:['',''], qua:['',''], qui:['',''], sex:['',''], sab:['',''], dom:['',''] }
                });
                salvarDados();
                document.getElementById('novoNome').value = '';
            }
        }

        function removerMembro(index) {
            if (confirm('Remover esse membro?')) {
                dados.membros.splice(index, 1);
                salvarDados();
            }
        }

        function editarMembro(index) {
            const novoNome = prompt('Novo nome:', dados.membros[index].nome);
            if (novoNome !== null && novoNome.trim() !== '') {
                dados.membros[index].nome = novoNome.trim();
                salvarDados();
            }
        }

        function adicionarMov() {
            if (permissao !== 'admin') { alert('Sem permissão!'); return; }
            const desc = document.getElementById('movDesc').value.trim();
            const qtd = parseInt(document.getElementById('movQtd').value);
            const val = parseFloat(document.getElementById('movVal').value);
            if (desc && !isNaN(qtd) && !isNaN(val)) {
                dados.movimentacoes.unshift({ desc, qtd, val });
                dados.estoque -= qtd;
                dados.caixa += val;
                salvarDados();
                document.getElementById('movDesc').value = '';
                document.getElementById('movQtd').value = '';
                document.getElementById('movVal').value = '';
            }
        }

        function removerMov(index) {
            if (confirm('Excluir esse registro?')) {
                dados.movimentacoes.splice(index, 1);
                salvarDados();
            }
        }

        function sair() {
            localStorage.removeItem('usuario');
            localStorage.removeItem('permissao');
            window.location.href = 'index.html';
        }

        carregarTela();
    </script>
</body>
</html>
