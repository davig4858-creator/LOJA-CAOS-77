<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 LOJA CAOS 77</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
body{background:#0a0a0a;min-height:100vh;display:flex;justify-content:center;align-items:center;color:#e5e5e5;}
.login-box{background:#171717;padding:40px;border-radius:8px;border:1px solid #333;width:90%;max-width:400px;text-align:center;}
h1{color:#ff6b00;margin-bottom:5px;font-size:28px;}
.subtitulo{color:#999;margin-bottom:30px;font-size:14px;}
input{width:100%;padding:14px;margin:8px 0;border:1px solid #333;border-radius:4px;background:#222;color:#fff;font-size:16px;}
button{width:100%;padding:14px;background:#ff6b00;color:#000;border:none;border-radius:4px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:10px;}
button:hover{background:#ff8800;}
.erro{color:#ff4444;margin-top:15px;display:none;}
.links{margin-top:25px;}
.links a{color:#ff6b00;text-decoration:none;font-size:14px;}
</style>
</head>
<body>
<div class="login-box">
<h1>🔥 LOJA CAOS 77</h1>
<p class="subtitulo">Controle Interno — Área Restrita</p>

<input type="text" id="usuario" placeholder="Usuário" autocomplete="off">
<input type="password" id="senha" placeholder="Senha">
<button onclick="fazerLogin()">ENTRAR</button>
<div class="erro" id="erro">❌ Usuário ou senha inválidos</div>

<div class="links">
<a href="painel.html">👉 Acesso de Visitante (sem login)</a>
</div>
</div>

<script>
const usuarios = {
  "ADMIN": { senha: "caos77", nivel: "admin" }
};

function fazerLogin() {
  const user = document.getElementById("usuario").value.trim();
  const senha = document.getElementById("senha").value;
  
  if (usuarios[user] && usuarios[user].senha === senha) {
    localStorage.setItem("usuario", user);
    localStorage.setItem("nivel", usuarios[user].nivel);
    window.location.href = "controle.html";
  } else {
    document.getElementById("erro").style.display = "block";
  }
}
</script>
</body>
</html>
