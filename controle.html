<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAINEL DE CONTROLE — LOJA CAOS 77</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

:root{
  --bg-dark: #0A0F1A;
  --bg-card: #0F1726;
  --bg-card-hover: #172338;
  --azul: #00D4FF;
  --verde: #00FF88;
  --vermelho: #FF3B3B;
  --texto: #E0E6ED;
  --texto-sec: #8A9AB8;
}

body{
  background:var(--bg-dark);
  min-height:100vh;color:var(--texto);padding:0;margin:0;
  background-image: 
    linear-gradient(rgba(0,212,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.02) 1px, transparent 1px);
  background-size:25px 25px;
}

.header-top{
  background:linear-gradient(180deg, rgba(15,23,38,0.95), rgba(10,15,26,0.9));
  padding:18px 20px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(0,212,255,0.1);position:sticky;top:0;z-index:100;
  backdrop-filter:blur(10px);
}

.header-top .title{font-size:20px;font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:10px;}
.header-top .title span{color:var(--azul);}
.status-badge{
  background:rgba(0,255,136,0.1);color:var(--verde);padding:6px 14px;border-radius:20px;
  font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;border:1px solid rgba(0,255,136,0.2);
}
.status-badge::before{content:'';width:8px;height:8px;background:var(--verde);border-radius:50%;animation:pulse-green 2s infinite;}
@keyframes pulse-green{0%,100%{opacity:1;}50%{opacity:0.4;}}

.container{max-width:1000px;margin:0 auto;padding:25px 10px;}

/* ✅ ESTOQUE EDITÁVEL — PARTE DE CIMA MANTIDA */
.estoque-card{
  background:rgba(0,0,0,0.25);border:1px solid var(--azul);border-radius:10px;padding:16px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;
}
.estoque-label{font-size:14px;font-weight:700;color:var(--azul);text-transform:uppercase;letter-spacing:0.5px;}
.estoque-input{
  background:#050508;border:2px solid var(--azul);border-radius:6px;color:var(--azul);
  font-size:18px;font-weight:800;text-align:center;padding:8px 16px;width:140px;outline:none;
}
.estoque-input:focus{box-shadow:0 0 0 2px rgba(0,212,255,0.25);}

.search-bar{
  width:100%;padding:14px 18px;background:var(--bg-card);border:1px solid rgba(0,212,255,0.15);
  border-radius:10px;color:var(--texto);font-size:15px;margin-bottom:20px;outline:none;
}
.search-bar:focus{border-color:var(--azul);}
.search-bar::placeholder{color:var(--texto-sec);}

.btn-add{
  width:100%;padding:16px;background:linear-gradient(90deg,#00B8E6,#00D4FF);border:none;
  border-radius:10px;color:#000;font-size:16px;font-weight:800;cursor:pointer;
  margin-bottom:25px;transition:all 0.2s ease;box-shadow:0 0 20px rgba(0,212,255,0.25);
}
.btn-add:hover{transform:translateY(-2px);}

.dias-header{
  display:grid;grid-template-columns:200px repeat(6,1fr) 100px;gap:4px;
  padding:12px 8px;color:var(--azul);font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.5px;border-bottom:1px solid rgba(0,212,255,0.15);margin-bottom:8px;
  text-align:center;
}
.dias-header .nome-col{text-align:left;}

.membro-row{
  display:grid;grid-template-columns:200px repeat(6,1fr) 100px;gap:4px;
  padding:10px 8px;border-radius:10px;background:var(--bg-card);margin-bottom:8px;
  align-items:center;border:1px solid transparent;transition:all 0.2s ease;
}
.membro-row:hover{background:var(--bg-card-hover);border-color:rgba(0,212,255,0.15);}

.membro-nome{font-size:14px;font-weight:700;color:var(--texto);display:flex;align-items:center;gap:6px;}
.coroa{font-size:16px;filter:drop-shadow(0 0 3px gold);}

.meta-dia{
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.meta-num{font-size:12px;font-weight:600;color:var(--texto-sec);}
.bolinhas{display:flex;gap:4px;}
.bolinha{
  width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  font-size:15px;cursor:pointer;user-select:none;transition:all 0.15s ease;
  background:rgba(255,255,255,0.05);border-radius:50%;border:1px dashed rgba(255,255,255,0.15);
}
.bolinha:empty::after{content:'-';color:rgba(255,255,255,0.2);}
.bolinha:hover{background:rgba(255,255,255,0.1);border-style:solid;}
.bolinha:active{transform:scale(0.9);}

.btn-del{
  padding:8px 10px;background:linear-gradient(135deg,#5C1A1A,#7A2424);border:none;
  border-radius:6px;color:#FF6B6B;font-size:12px;font-weight:700;cursor:pointer;
  transition:all 0.2s ease;width:100%;
}
.btn-del:hover{transform:scale(1.03);}

.modal-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);
  display:none;justify-content:center;align-items:center;z-index:200;backdrop-filter:blur(6px);
}
.modal{
  background:var(--bg-card);border:1px solid rgba(0,212,255,0.2);border-radius:14px;padding:25px;
  width:90%;max-width:450px;
}
.modal h3{color:var(--azul);font-size:18px;margin-bottom:20px;}
.modal input{
  width:100%;padding:12px 14px;background:rgba(0,0,0,0.3);border:1px solid rgba(0,212,255,0.15);
  border-radius:8px;color:var(--texto);font-size:15px;margin-bottom:12px;outline:none;
}
.modal input:focus{border-color:var(--azul);}
.modal-buttons{display:flex;gap:10px;margin-top:10px;}
.modal-btn-cancel{flex:1;padding:12px;background:#2A3A58;border:none;border-radius:8px;color:var(--texto);font-weight:700;cursor:pointer;}
.modal-btn-save{flex:1;padding:12px;background:linear-gradient(90deg,#00B8E6,#00D4FF);border:none;border-radius:8px;color:#000;font-weight:800;cursor:pointer;}

@media(max-width:700px){
  .dias-header,.membro-row{grid-template-columns:150px repeat(6,55px) 80px;gap:2px;}
  .bolinha{width:22px;height:22px;font-size:13px;}
  .membro-nome{font-size:12px;}
}
</style>
</head>
<body>

<!-- ✅ PARTE DE CIMA — EXATAMENTE COMO ESTAVA -->
<div class="header-top">
  <div class="title">⚡ PAINEL DE CONTROLE <span>LOJA CAOS 77</span></div>
  <div class="status-badge">🟢 Sincronizado</div>
</div>

<div class="container">

<!-- ✅ ESTOQUE EDITÁVEL -->
<div class="estoque-card">
  <div class="estoque-label">📦 ESTOQUE TOTAL DE FRAGMENTOS</div>
  <input type="text" class="estoque-input" id="estoqueTotal" placeholder="0" onblur="salvarEstoque()">
</div>

<input type="text" class="search-bar" placeholder="🔍 Buscar por nome..." id="busca" oninput="filtrarLista()">

<button class="btn-add" onclick="abrirModal()">+ ADICIONAR INTEGRANTE</button>

<div class="dias-header">
  <div class="nome-col">NOME</div>
  <div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
  <div>AÇÃO</div>
</div>

<div id="listaIntegrantes"></div>

</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitulo">➕ Adicionar Integrante</h3>
    <input type="text" id="inputNome" placeholder="Nome do integrante">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
      <input type="checkbox" id="inputCoroa" style="width:auto;margin:0;">
      <label for="inputCoroa" style="color:var(--texto);font-size:14px;">👑 Líder</label>
    </div>
    <div class="modal-buttons">
      <button class="modal-btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="modal-btn-save" onclick="salvarIntegrante()">Salvar</button>
    </div>
  </div>
</div>

<script>
const DATABASE_URL = 'https://loja-caos-77-default-rtdb.firebaseio.com/.json';

let integrantes = [];
const dias = ['seg','ter','qua','qui','sex','sab'];

// ✅ Bolinha: vazio → 🟢 → 🔴 → vazio
function trocarBolinha(id, dia, posicao){
  const idx = integrantes.findIndex(x=>x.id===id);
  if(idx === -1) return;
  
  if(!integrantes[idx].dias) integrantes[idx].dias = {};
  if(!integrantes[idx].dias[dia]) integrantes[idx].dias[dia] = ['',''];
  
  const atual = integrantes[idx].dias[dia][posicao];
  if(atual === '') integrantes[idx].dias[dia][posicao] = 'G';
  else if(atual === 'G') integrantes[idx].dias[dia][posicao] = 'R';
  else integrantes[idx].dias[dia][posicao] = '';
  
  salvarDados();
  renderLista();
}

async function salvarEstoque(){
  await salvarDados();
}

async function carregarDados(){
  try{
    const res = await fetch(DATABASE_URL);
    const data = await res.json();
    
    if(data){
      if(data.integrantes) integrantes = data.integrantes;
      if(data.estoque !== undefined){
        document.getElementById('estoqueTotal').value = data.estoque;
      }
    }
    
    renderLista();
  }catch(e){
    console.log('Erro:',e);
  }
}

async function salvarDados(){
  const dados = { integrantes, estoque: document.getElementById('estoqueTotal').value };
  await fetch(DATABASE_URL, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(dados)
  });
}

window.onload = carregarDados;

function renderLista(filtro=''){
  const container = document.getElementById('listaIntegrantes');
  container.innerHTML = '';
  
  const filtrados = integrantes.filter(i=>
    i.nome.toLowerCase().includes(filtro.toLowerCase())
  );
  
  filtrados.forEach(i=>{
    const row = document.createElement('div');
    row.className = 'membro-row';
    
    let diasHTML = '';
    dias.forEach(dia=>{
      if(!i.dias) i.dias = {};
      if(!i.dias[dia]) i.dias[dia] = ['',''];
      
      diasHTML += `
        <div class="meta-dia">
          <div class="meta-num">120</div>
          <div class="bolinhas">
            <div class="bolinha" onclick="trocarBolinha(${i.id}, '${dia}', 0)">${i.dias[dia][0]==='G'?'🟢':i.dias[dia][0]==='R'?'🔴':''}</div>
            <div class="bolinha" onclick="trocarBolinha(${i.id}, '${dia}', 1)">${i.dias[dia][1]==='G'?'🟢':i.dias[dia][1]==='R'?'🔴':''}</div>
          </div>
        </div>
      `;
    });
    
    row.innerHTML = `
      <div class="membro-nome">
        ${i.coroa ? '<span class="coroa">👑</span>' : ''}
        ${i.nome}
      </div>
      ${diasHTML}
      <button class="btn-del" onclick="excluir(${i.id})">EXPULSO</button>
    `;
    container.appendChild(row);
  });
}

function filtrarLista(){
  const valor = document.getElementById('busca').value;
  renderLista(valor);
}

function abrirModal(){
  document.getElementById('modalTitulo').textContent = '➕ Adicionar Integrante';
  document.getElementById('inputNome').value = '';
  document.getElementById('inputCoroa').checked = false;
  document.getElementById('modal').style.display = 'flex';
}

function fecharModal(){
  document.getElementById('modal').style.display = 'none';
}

function salvarIntegrante(){
  const nome = document.getElementById('inputNome').value.trim();
  const coroa = document.getElementById('inputCoroa').checked;
  if(!nome){alert('Digite o nome!');return;}
  
  integrantes.push({
    id: Date.now(),
    nome: nome,
    coroa: coroa,
    dias: {
      seg:['',''], ter:['',''], qua:['',''],
      qui:['',''], sex:['',''], sab:['','']
    }
  });
  
  fecharModal();
  salvarDados();
  renderLista();
}

function excluir(id){
  if(confirm('Tem certeza?')){
    integrantes = integrantes.filter(x=>x.id!==id);
    salvarDados();
    renderLista();
  }
}
</script>
</body>
</html>
