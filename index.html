<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 LOJA CAOS 77</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{
  background:linear-gradient(135deg,#0f0f0f 0%,#1a1a1a 50%,#0f0f0f 100%);
  min-height:100vh;
  display:flex;justify-content:center;align-items:center;
  color:#fff;position:relative;overflow:hidden;
}
body::before{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle at 30% 30%,rgba(255,107,0,0.08) 0%,transparent 55%),
              radial-gradient(circle at 70% 70%,rgba(255,68,0,0.05) 0%,transparent 50%);
  animation:brilho 8s ease-in-out infinite;
}
@keyframes brilho{
  0%,100%{transform:translate(0,0);}
  50%{transform:translate(30px,-30px);}
}
.login-box{
  background:rgba(20,20,20,0.9);backdrop-filter:blur(20px);
  padding:45px 35px;border-radius:20px;border:1px solid rgba(255,107,0,0.2);
  width:90%;max-width:420px;text-align:center;position:relative;z-index:1;
  box-shadow:0 0 60px rgba(255,107,0,0.1),inset 0 1px 0 rgba(255,255,255,0.05);
}
.logo{font-size:50px;margin-bottom:10px;filter:drop-shadow(0 0 15px #ff6b00);}
h1{color:#ff6b00;font-size:32px;font-weight:900;letter-spacing:2px;margin-bottom:5px;}
.subtitulo{color:#888;font-size:14px;margin-bottom:40px;letter-spacing:1px;}
.input-group{position:relative;margin-bottom:20px;}
input{
  width:100%;padding:16px 18px;border:1px solid #333;border-radius:12px;
  background:rgba(30,30,30,0.8);color:#fff;font-size:15px;font-weight:500;
  outline:none;transition:all 0.3s ease;
}
input:focus{border-color:#ff6b00;box-shadow:0 0 0 3px rgba(255,107,0,0.1);background:rgba(40,40,40,0.9);}
input::placeholder{color:#666;}
button{
  width:100%;padding:16px;background:linear-gradient(135deg,#ff6b00 0%,#ff4400 100%);
  color:#000;border:none;border-radius:12px;font-weight:800;font-size:16px;
  cursor:pointer;transition:all 0.3s ease;margin-top:10px;
  box-shadow:0 4px 20px rgba(255,107,0,0.3);letter-spacing:1px;
}
button:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(255,107,0,0.4);}
button:active{transform:translateY(0);}
.erro{
  color:#ff4444;margin-top:20px;display:none;font-size:14px;
  background:rgba(255,68,68,0.1);padding:10px;border-radius:8px;border:1px solid rgba(255,68,68,0.2);
}
.links{margin-top:30px;padding-top:25px;border-top:1px solid rgba(255,255,255,0.05);}
.links a{
  color:#ff6b00;text-decoration:none;font-size:14px;font-weight:600;
  transition:color 0.2s ease;
}
.links a:hover{color:#ff8800;text-decoration:underline;}
</style>
</head>
<body>
<div class="login-box">
<div class="logo">🔥</div>
<h1>LOJA CAOS 77</h1>
<p class="subtitulo">CONTROLE INTERNO • ÁREA RESTRITA</p>

<div class="input-group">
<input type="text" id="usuario" placeholder="Usuário" autocomplete="off">
</div>
<div class="input-group">
<input type="password" id="senha" placeholder="Senha">
</div>

<button onclick="fazerLogin()">ENTRAR NO SISTEMA</button>
<div class="erro" id="erro">❌ Usuário ou senha inválidos</div>

<div class="links">
<a href="painel.html">👁️ Acesso de Visitante (sem login)</a>
</div>
</div>

<script>
const usuarios = {
  "ADMIN": { senha: "caos77", nivel: "admin" }
};

function fazerLogin() {
  const user = document.getElementById("usuario").value.trim();
  const senha = document.getElementById("senha").value;
  
  if (usuarios[user] && usuarios[user].senha === senha) {
    localStorage.setItem("usuario", user);
    localStorage.setItem("nivel", usuarios[user].nivel);
    window.location.href = "controle.html";
  } else {
    document.getElementById("erro").style.display = "block";
  }
}
</script>
</body>
</html>
