<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 LOJA CAOS 77 — Controle</title>
<style>
:root{--bg:#101014;--panel:#1b1b23;--panel2:#272731;--red:#ff4d4d;--gold:#ffc107;--text:#f5f5f7;--muted:#a5a5b3;--green:#28c76f}
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{margin:0;background:radial-gradient(circle at top,#24202a 0,#101014 55%);color:var(--text);min-height:100vh;padding:16px}
.wrap{max-width:1000px;margin:auto}
.topo{text-align:center;padding:25px 18px;border-radius:18px;border:1px solid #ff4d4d88;background:linear-gradient(135deg,#1b1b23,#302027);margin-bottom:18px;box-shadow:0 10px 35px #0005}
.topo h1{margin:0 0 7px;color:var(--red);font-size:clamp(24px,5vw,34px);letter-spacing:1px}
.topo p{margin:0;color:var(--muted);font-size:14px}
.abas{display:flex;gap:8px;margin-bottom:18px;overflow:auto;padding-bottom:3px}
.aba-btn{flex:1;min-width:105px;padding:13px 16px;background:var(--panel2);border:1px solid #3b3b48;color:var(--muted);border-radius:11px;font-weight:bold;cursor:pointer}
.aba-btn.ativa{background:var(--red);color:#fff;border-color:var(--red)}
.aba-conteudo{display:none}.aba-conteudo.mostra{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}
.card{background:var(--panel);border:1px solid #34343f;border-radius:15px;padding:20px;margin-bottom:16px;box-shadow:0 7px 24px #0002}
.card h2{margin:0 0 16px;color:var(--red);font-size:19px}
input{width:100%;padding:13px 14px;border:1px solid #3b3b49;border-radius:9px;background:var(--panel2);color:var(--text);font-size:16px;margin-bottom:12px;outline:none}
input:focus{border-color:var(--red)}
button{border:0;border-radius:9px;padding:12px 14px;background:var(--red);color:white;font-weight:bold;font-size:14px;cursor:pointer;transition:.15s}
button:hover{filter:brightness(1.08)}button:active{transform:scale(.98)}
button.secundario{background:#353541;color:var(--text)}button.sucesso{background:var(--green);color:#07170d}button.perigo{background:#b8323c}
.linha{display:flex;gap:10px;flex-wrap:wrap}.linha>*{flex:1;min-width:130px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--panel2);border:1px solid #393944;border-radius:11px;padding:13px;margin-bottom:10px}
.info{flex:1;min-width:150px}.nome{font-weight:bold;overflow-wrap:anywhere}.valor{color:var(--gold);font-weight:bold;margin-top:5px;font-size:14px}
.acoes{display:flex;align-items:center;gap:6px}.acoes button{padding:9px 11px}.acoes .qtd{min-width:25px;text-align:center;font-weight:bold}
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.resumo-card{background:var(--panel);border:1px solid #34343f;border-radius:13px;text-align:center;padding:18px}
.numero{font-size:clamp(22px,4vw,28px);font-weight:bold;color:var(--gold);overflow-wrap:anywhere}.rotulo{color:var(--muted);font-size:13px;margin-top:5px}
.vazio{text-align:center;padding:24px 10px;color:var(--muted)}
.total{margin:18px 0;text-align:right;font-size:22px;font-weight:bold;color:var(--gold)}
.nota{color:var(--muted);font-size:12px;margin-top:10px}
@media(max-width:520px){body{padding:10px}.card{padding:15px}.abas{gap:6px}.aba-btn{padding:12px 10px}.item{align-items:flex-start}.acoes{width:100%;justify-content:flex-end}.linha button{min-width:100%}}
@media print{
 body{background:#fff;color:#000;padding:0}.wrap{max-width:none}.topo,.abas,#produtos,#historico,.no-print{display:none!important}
 #pedidos{display:block!important}.card{background:#fff;border:0;box-shadow:none;padding:0}
 #pedidos h2{color:#000}.item{background:#fff;border:1px solid #bbb;color:#000}
 .valor,.total{color:#000}.acoes{display:none!important}input{border:0;background:#fff;color:#000;padding:4px}
}
</style>
</head>
<body>
<div class="wrap">
<header class="topo"><h1>🔥 LOJA CAOS 77</h1><p>Painel de Controle Interno</p></header>
<nav class="abas">
<button class="aba-btn ativa" data-aba="pedidos">📋 Pedidos</button>
<button class="aba-btn" data-aba="produtos">🛒 Produtos</button>
<button class="aba-btn" data-aba="historico">📊 Histórico</button>
</nav>
<section id="pedidos" class="aba-conteudo mostra">
<div class="card">
<h2>Novo Pedido</h2>
<input id="clienteNome" type="text" placeholder="Nome do cliente" autocomplete="name">
<input id="clienteEndereco" type="text" placeholder="Endereço / local de entrega">
<div id="itensPedidoAtual"><p class="vazio">Nenhum item adicionado. Vá em Produtos para escolher.</p></div>
<div class="total">Total: <span id="totalPedido">R$ 0,00</span></div>
<div class="linha no-print"><button class="sucesso" onclick="finalizarPedido()">✅ Finalizar e imprimir</button><button class="secundario" onclick="limparPedido()">🗑️ Limpar pedido</button></div>
<p class="nota">Os pedidos e produtos ficam salvos neste navegador/aparelho.</p>
</div>
</section>
<section id="produtos" class="aba-conteudo">
<div class="card">
<h2>Adicionar Produto</h2>
<input id="produtoNome" type="text" placeholder="Nome do produto">
<input id="produtoValor" type="number" placeholder="Valor (R$)" min="0.01" step="0.01">
<button onclick="adicionarProduto()">➕ Salvar produto</button>
</div>
<div class="card"><h2>Cardápio / Produtos</h2><div id="listaProdutos"></div></div>
</section>
<section id="historico" class="aba-conteudo">
<div class="resumo">
<div class="resumo-card"><div class="numero" id="totalVendasDia">R$ 0,00</div><div class="rotulo">Total de vendas</div></div>
<div class="resumo-card"><div class="numero" id="qtdPedidosDia">0</div><div class="rotulo">Pedidos registrados</div></div>
</div>
<div class="card"><h2>Pedidos registrados</h2><div id="listaHistorico"></div>
<div class="linha no-print" style="margin-top:16px"><button class="secundario" onclick="baixarRelatorio()">📥 Baixar relatório</button><button class="perigo" onclick="limparHistorico()">🗑️ Limpar histórico</button></div>
</div>
</section>
</div>
<script>
"use strict";
const STORAGE_PRODUCTS="caos77_produtos", STORAGE_HISTORY="caos77_historico";
function lerStorage(chave){try{const v=JSON.parse(localStorage.getItem(chave)||"[]");return Array.isArray(v)?v:[]}catch(e){return []}}
let produtos=lerStorage(STORAGE_PRODUCTS),historico=lerStorage(STORAGE_HISTORY),pedidoAtual=[];
const dinheiro=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const escapeHTML=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function salvarProdutos(){localStorage.setItem(STORAGE_PRODUCTS,JSON.stringify(produtos))}
function salvarHistorico(){localStorage.setItem(STORAGE_HISTORY,JSON.stringify(historico))}
document.querySelectorAll(".aba-btn").forEach(btn=>btn.addEventListener("click",()=>{
 document.querySelectorAll(".aba-btn").forEach(b=>b.classList.toggle("ativa",b===btn));
 document.querySelectorAll(".aba-conteudo").forEach(a=>a.classList.toggle("mostra",a.id===btn.dataset.aba));
}));
function adicionarProduto(){
 const nome=document.getElementById("produtoNome").value.trim(),valor=Number(document.getElementById("produtoValor").value);
 if(!nome||!Number.isFinite(valor)||valor<=0){alert("Informe o nome e um valor válido.");return}
 produtos.push({id:Date.now()+Math.random(),nome,valor});
 salvarProdutos();renderizarProdutos();
 document.getElementById("produtoNome").value="";document.getElementById("produtoValor").value="";
}
function removerProduto(id){
 if(!confirm("Excluir este produto do cardápio?"))return;
 produtos=produtos.filter(p=>p.id!==id);salvarProdutos();renderizarProdutos();
}
function renderizarProdutos(){
 const el=document.getElementById("listaProdutos");
 if(!produtos.length){el.innerHTML='<p class="vazio">Nenhum produto cadastrado.</p>';return}
 el.innerHTML=produtos.map(p=>`<div class="item"><div class="info"><div class="nome">${escapeHTML(p.nome)}</div><div class="valor">${dinheiro(p.valor)}</div></div><div class="acoes"><button onclick="adicionarAoPedido(${Number(p.id)})">➕ Pedido</button><button class="perigo" onclick="removerProduto(${Number(p.id)})" aria-label="Excluir produto">🗑️</button></div></div>`).join("");
}
function adicionarAoPedido(id){
 const p=produtos.find(x=>Number(x.id)===Number(id));if(!p)return;
 const existente=pedidoAtual.find(x=>Number(x.id)===Number(id));
 if(existente)existente.quantidade++;else pedidoAtual.push({id:p.id,nome:p.nome,valor:Number(p.valor),quantidade:1});
 renderizarPedidoAtual();
}
function alterarQuantidade(id,delta){
 const i=pedidoAtual.find(x=>Number(x.id)===Number(id));if(!i)return;
 i.quantidade+=delta;if(i.quantidade<=0)pedidoAtual=pedidoAtual.filter(x=>x!==i);
 renderizarPedidoAtual();
}
function renderizarPedidoAtual(){
 const el=document.getElementById("itensPedidoAtual");
 if(!pedidoAtual.length){el.innerHTML='<p class="vazio">Nenhum item adicionado.</p>';document.getElementById("totalPedido").textContent=dinheiro(0);return}
 el.innerHTML=pedidoAtual.map(i=>`<div class="item"><div class="info"><div class="nome">${escapeHTML(i.nome)}</div><div class="valor">${dinheiro(i.valor*i.quantidade)}</div></div><div class="acoes"><button class="secundario" onclick="alterarQuantidade(${Number(i.id)},-1)">−</button><span class="qtd">${i.quantidade}</span><button onclick="alterarQuantidade(${Number(i.id)},1)">+</button></div></div>`).join("");
 document.getElementById("totalPedido").textContent=dinheiro(pedidoAtual.reduce((s,i)=>s+i.valor*i.quantidade,0));
}
function limparPedido(){
 if(pedidoAtual.length&&!confirm("Limpar o pedido atual?"))return;
 pedidoAtual=[];document.getElementById("clienteNome").value="";document.getElementById("clienteEndereco").value="";renderizarPedidoAtual();
}
function finalizarPedido(){
 const cliente=document.getElementById("clienteNome").value.trim(),endereco=document.getElementById("clienteEndereco").value.trim();
 if(!cliente){alert("Digite o nome do cliente.");return}if(!pedidoAtual.length){alert("Adicione pelo menos um produto.");return}
 const total=pedidoAtual.reduce((s,i)=>s+i.valor*i.quantidade,0);
 const pedido={id:Date.now(),data:new Date().toLocaleString("pt-BR"),cliente,endereco,itens:pedidoAtual.map(i=>({nome:i.nome,qtd:i.quantidade,val:i.valor})),total};
 historico.unshift(pedido);salvarHistorico();renderizarHistorico();atualizarResumo();
 window.print();
 pedidoAtual=[];document.getElementById("clienteNome").value="";document.getElementById("clienteEndereco").value="";renderizarPedidoAtual();
}
function renderizarHistorico(){
 const el=document.getElementById("listaHistorico");
 if(!historico.length){el.innerHTML='<p class="vazio">Nenhum pedido registrado.</p>';return}
 el.innerHTML=historico.map(p=>`<div class="item"><div class="info"><div class="nome">${escapeHTML(p.cliente)} — ${escapeHTML(p.data)}</div><div class="valor">Total: ${dinheiro(p.total)}</div><div class="nota">${escapeHTML(p.endereco||"Sem endereço")}</div></div><div class="acoes"><button onclick="imprimirUmPedido(${Number(p.id)})">🖨️ Imprimir</button><button class="perigo" onclick="excluirPedido(${Number(p.id)})">🗑️</button></div></div>`).join("");
}
function excluirPedido(id){
 if(!confirm("Excluir este pedido do histórico?"))return;
 historico=historico.filter(p=>Number(p.id)!==Number(id));salvarHistorico();renderizarHistorico();atualizarResumo();
}
function imprimirUmPedido(id){
 const p=historico.find(x=>Number(x.id)===Number(id));if(!p)return;
 pedidoAtual=p.itens.map(i=>({id:Date.now()+Math.random(),nome:i.nome,valor:Number(i.val),quantidade:Number(i.qtd)}));
 document.getElementById("clienteNome").value=p.cliente||"";document.getElementById("clienteEndereco").value=p.endereco||"";
 renderizarPedidoAtual();document.querySelector('[data-aba="pedidos"]').click();window.print();
}
function atualizarResumo(){
 document.getElementById("totalVendasDia").textContent=dinheiro(historico.reduce((s,p)=>s+Number(p.total||0),0));
 document.getElementById("qtdPedidosDia").textContent=historico.length;
}
function limparHistorico(){
 if(!confirm("Tem certeza que deseja apagar todos os pedidos do histórico?"))return;
 historico=[];salvarHistorico();renderizarHistorico();atualizarResumo();
}
function baixarRelatorio(){
 if(!historico.length){alert("Não há pedidos para exportar.");return}
 let linhas=["LOJA CAOS 77 — RELATÓRIO DE PEDIDOS","Gerado em: "+new Date().toLocaleString("pt-BR"),"========================================"];
 historico.forEach(p=>{
  linhas.push("Pedido: "+p.id,"Data: "+p.data,"Cliente: "+p.cliente,"Endereço: "+(p.endereco||"Não informado"));
  (p.itens||[]).forEach(i=>linhas.push(" - "+i.nome+" | "+i.qtd+" x "+dinheiro(i.val)+" = "+dinheiro(i.qtd*i.val)));
  linhas.push("TOTAL: "+dinheiro(p.total),"----------------------------------------");
 });
 linhas.push("TOTAL GERAL: "+dinheiro(historico.reduce((s,p)=>s+Number(p.total||0),0)));
 const blob=new Blob(["\uFEFF"+linhas.join("\n")],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="relatorio-caos77-"+new Date().toISOString().slice(0,10)+".txt";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
renderizarProdutos();renderizarHistorico();renderizarPedidoAtual();atualizarResumo();
</script>
</body>
</html>
