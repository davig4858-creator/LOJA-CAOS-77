<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DK HAMBURGUERIA — Painel</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Roboto, sans-serif;
}
body {
  background: #080418;
  color: #ffffff;
  min-height: 100vh;
  padding: 12px;
}
.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.tab {
  padding: 12px 24px;
  background: #1a1040;
  border: 2px solid #D4AF37;
  border-radius: 10px;
  color: #fff;
  cursor: pointer;
  font-size: 16px;
  transition: all 0.3s;
}
.tab.active {
  background: #D4AF37;
  color: #000;
  font-weight: bold;
}
.panel {
  display: none;
  animation: fadeIn 0.3s;
}
.panel.active {
  display: block;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
h2, h3 {
  color: #D4AF37;
  margin: 20px 0 12px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.full {
  grid-column: 1 / -1;
}
label {
  display: block;
  margin-bottom: 6px;
  font-weight: 500;
  color: #d0d0d0;
}
input, textarea {
  width: 100%;
  padding: 12px;
  border: 2px solid #444;
  border-radius: 8px;
  background: #120c2e;
  color: #fff;
  font-size: 16px;
}
input:focus, textarea:focus {
  outline: none;
  border-color: #D4AF37;
}
.btn {
  padding: 12px 20px;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s;
}
.btn:active {
  transform: scale(0.97);
}
.btn.wide {
  width: 100%;
}
.btn.green {
  background: linear-gradient(135deg, #2ecc71, #27ae60);
  color: #fff;
}
.btn.gold {
  background: linear-gradient(135deg, #D4AF37, #b8941f);
  color: #000;
}
.btn.purple {
  background: linear-gradient(135deg, #6c5ce7, #5541d7);
  color: #fff;
}
.btn.red {
  background: linear-gradient(135deg, #e74c3c, #c0392b);
  color: #fff;
}
.btn.small {
  padding: 6px 12px;
  font-size: 14px;
}
.card {
  background: #1a1040;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}
.name {
  font-size: 16px;
  font-weight: 600;
}
.price {
  color: #D4AF37;
  font-weight: bold;
}
.quantity-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}
.qty-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: #D4AF37;
  color: #000;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.qty-text {
  min-width: 24px;
  text-align: center;
  font-weight: bold;
  font-size: 16px;
}
.summary {
  background: #1a1040;
  border: 2px solid #D4AF37;
  border-radius: 10px;
  padding: 20px;
  margin: 20px 0;
}
.summaryline {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  font-size: 16px;
}
.total {
  border-top: 1px solid #444;
  margin-top: 8px;
  padding-top: 12px;
  font-size: 20px;
  font-weight: bold;
}
.order-actions {
  display: flex;
  gap: 10px;
  margin: 20px 0;
  flex-wrap: wrap;
}
.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.empty {
  text-align: center;
  padding: 30px;
  color: #888;
  font-style: italic;
}
.history-item {
  background: #1a1040;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 12px;
}
.history-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
  flex-wrap: wrap;
  gap: 8px;
}
.history-id {
  font-weight: bold;
  color: #D4AF37;
}
footer {
  text-align: center;
  margin-top: 40px;
  padding: 20px;
  color: #666;
  font-size: 14px;
}

/* 🖨️ Estilo de impressão bem limpo */
@media print {
  body { background: #fff; color: #000; font-family: monospace; font-size: 14px; padding: 0; }
  .no-print, .tabs, .order-actions, button, h2, h3 { display: none !important; }
  .print-only { display: block !important; }
  .print-line { font-size: 14px; line-height: 1.4; }
  .print-center { text-align: center; }
  .print-right { text-align: right; }
  .print-dash { border-bottom: 1px dashed #000; margin: 4px 0; }
  @page { margin: 5mm; }
}

.no-print { display: block; }
.print-only { display: none; }
</style>
</head>
<body>

<h1 style="text-align:center; color:#D4AF37; margin-bottom:10px;">🍔 DK HAMBURGUERIA</h1>

<nav class="tabs no-print">
<button class="tab active" onclick="showTab('orders',this)">🧾 Pedidos</button>
<button class="tab" onclick="showTab('menu',this)">🍔 Cadastrar Lanches</button>
</nav>

<section id="orders" class="panel active">
<h2>Novo Pedido</h2>
<div class="grid">
<div><label for="customer">NOME DO CLIENTE</label><input id="customer" placeholder="Nome do cliente" autocomplete="name"></div>
<div><label for="fee">TAXA DE ENTREGA (R$)</label><input id="fee" type="number" min="0" step="0.01" placeholder="0,00" oninput="renderCart()"></div>
<div class="full"><label for="address">ENDEREÇO</label><textarea id="address" rows="2" placeholder="Rua, número, bairro e referência"></textarea></div>
</div>

<h3>🎁 Combo / item avulso</h3>
<div class="grid">
<div><label for="comboName">NOME DO COMBO</label><input id="comboName" placeholder="Ex.: Combo casal"></div>
<div><label for="comboPrice">VALOR (R$)</label><input id="comboPrice" type="number" min="0" step="0.01" placeholder="0,00"></div>
<div class="full"><button class="btn green wide" onclick="addCombo()">＋ Adicionar combo ao pedido</button></div>
</div>

<h3>🍔 Lanches cadastrados</h3>
<div id="menuForOrder"></div>

<h3>🛍️ Itens do pedido</h3>
<div id="cart"></div>

<div class="summary">
<div class="summaryline"><span>Subtotal</span><strong id="subtotal">R$ 0,00</strong></div>
<div class="summaryline"><span>Taxa de entrega</span><strong id="feeView">R$ 0,00</strong></div>
<div class="summaryline total"><span>TOTAL</span><strong id="total">R$ 0,00</strong></div>
</div>

<div class="order-actions no-print">
<button class="btn gold" onclick="finishOrder()">✓ Finalizar pedido</button>
<button class="btn purple" onclick="printCurrent()">🖨️ Imprimir pedido</button>
<button class="btn" style="background:#555; color:#fff;" onclick="clearCart()">🗑️ Limpar pedido</button>
</div>

<h3>📚 Histórico do dia — <span id="todayDate"></span></h3>
<div class="row no-print" style="margin-bottom:10px">
<button class="btn gold" onclick="saveDay()">💾 Salvar e baixar vendas do dia</button>
<button class="btn red" onclick="clearDay()">🗑️ Limpar histórico do dia</button>
</div>
<div id="history"></div>
</section>

<section id="menu" class="panel">
<h2>Cadastrar Lanches</h2>
<div class="grid">
<div><label for="newFood">NOME DO LANCHE</label><input id="newFood" placeholder="Ex.: DK Tradicional"></div>
<div><label for="newPrice">PREÇO (R$)</label><input id="newPrice" type="number" min="0" step="0.01" placeholder="0,00"></div>
<div class="full"><button class="btn gold wide" onclick="addFood()">＋ Cadastrar lanche</button></div>
</div>

<h3>📋 Lanches cadastrados</h3>
<div id="menuList"></div>
</section>

<footer>DK HAMBURGUERIA • Painel de Pedidos</footer>
</div>

<script>
const KEY_MENU = 'dk_menu_v1';
const KEY_ORDERS = 'dk_orders_v1';

let menu = load(KEY_MENU, []);
let orders = load(KEY_ORDERS, []);
let cart = [];

function money(n) {
  return 'R$ ' + Number(n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function load(key, fallback) {
  try {
    const v = JSON.parse(localStorage.getItem(key));
    return Array.isArray(v) ? v : fallback;
  } catch (e) { return fallback; }
}

function persist() {
  localStorage.setItem(KEY_MENU, JSON.stringify(menu));
  localStorage.setItem(KEY_ORDERS, JSON.stringify(orders));
}

function today() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function todayBr() {
  const d = new Date();
  return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
}

function showTab(id, button) {
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === id));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === button));
}

// ========== CADASTRO DE LANCHES ==========
function addFood() {
  const name = document.getElementById('newFood').value.trim();
  const price = Number(document.getElementById('newPrice').value);
  if (!name || !Number.isFinite(price) || price <= 0) {
    alert('Informe o nome e um preço válido.');
    return;
  }
  menu.push({ id: Date.now() + Math.random(), name, price });
  persist();
  document.getElementById('newFood').value = '';
  document.getElementById('newPrice').value = '';
  renderMenu();
  renderMenuForOrder();
}

function deleteFood(id) {
  if (!confirm('Excluir este lanche do cadastro?')) return;
  menu = menu.filter(x => x.id !== id);
  persist();
  renderMenu();
  renderMenuForOrder();
}

function renderMenu() {
  const el = document.getElementById('menuList');
  if (!menu.length) {
    el.innerHTML = '<div class="empty">Nenhum lanche cadastrado ainda.</div>';
    return;
  }
  el.innerHTML = menu.map(x => `
    <div class="card">
      <div class="name">${esc(x.name)}<br><span class="price">${money(x.price)}</span></div>
      <button class="btn red small" onclick="deleteFood(${x.id})">Excluir</button>
    </div>
  `).join('');
}

function renderMenuForOrder() {
  const el = document.getElementById('menuForOrder');
  if (!menu.length) {
    el.innerHTML = '<div class="empty">Cadastre seus lanches na aba "Cadastrar Lanches".</div>';
    return;
  }
  el.innerHTML = menu.map(x => `
    <div class="card">
      <div class="name">${esc(x.name)}<br><span class="price">${money(x.price)}</span></div>
      <button class="btn green small" onclick="addToCart(${x.id})">＋ Adicionar</button>
    </div>
  `).join('');
}

// ========== CARRINHO DE PEDIDOS ==========
function addToCart(id) {
  const f = menu.find(x => x.id === id);
  if (!f) return;
  const existing = cart.find(x => x.itemId === id);
  if (existing) {
    existing.qty = (existing.qty || 1) + 1;
  } else {
    cart.push({ id: Date.now() + Math.random(), itemId: id, name: f.name, price: Number(f.price), qty: 1 });
  }
  renderCart();
}

function changeQty(cartId, delta) {
  const item = cart.find(x => x.id === cartId);
  if (!item) return;
  item.qty = (item.qty || 1) + delta;
  if (item.qty <= 0) {
    cart = cart.filter(x => x.id !== cartId);
  }
  renderCart();
}

function removeCart(id) {
  cart = cart.filter(x => x.id !== id);
  renderCart();
}

function addCombo() {
  const name = document.getElementById('comboName').value.trim();
  const price = Number(document.getElementById('comboPrice').value);
  if (!name || !Number.isFinite(price) || price <= 0) {
    alert('Informe o nome e o valor do combo.');
    return;
  }
  cart.push({ id: Date.now() + Math.random(), name: '🎁 ' + name, price, qty: 1, isCombo: true });
  document.getElementById('comboName').value = '';
  document.getElementById('comboPrice').value = '';
  renderCart();
}

function clearCart() {
  if (!cart.length) return;
  if (!confirm('Limpar todos os itens do pedido atual?')) return;
  cart = [];
  document.getElementById('customer').value = '';
  document.getElementById('address').value = '';
  document.getElementById('fee').value = '';
  renderCart();
}

function getFee() {
  return Math.max(0, Number(document.getElementById('fee').value) || 0);
}

function renderCart() {
  const el = document.getElementById('cart');
  const fee = getFee();
  let subtotal = 0;

  if (!cart.length) {
    el.innerHTML = '<div class="empty">Nenhum item adicionado ao pedido.</div>';
  } else {
    el.innerHTML = cart.map(x => {
      const totalItem = x.price * (x.qty || 1);
      subtotal += totalItem;
      return `
        <div class="card">
          <div>
            <div class="name">${esc(x.name)}</div>
            <div class="price">${money(x.price)} cada</div>
          </div>
          <div class="quantity-controls">
            <button class="qty-btn" onclick="changeQty(${x.id}, -1)">−</button>
            <span class="qty-text">${x.qty || 1}</span>
            <button class="qty-btn" onclick="changeQty(${x.id}, 1)">＋</button>
          </div>
          <div style="text-align:right; min-width:80px;">
            <strong>${money(totalItem)}</strong><br>
            <button class="btn red small" style="padding:4px 8px; font-size:12px; margin-top:4px;" onclick="removeCart(${x.id})">✕</button>
          </div>
        </div>
      `;
    }).join('');
  }

  const total = subtotal + fee;
  document.getElementById('subtotal').textContent = money(subtotal);
  document.getElementById('feeView').textContent = money(fee);
  document.getElementById('total').textContent = money(total);
}
