<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DK Hamburgueria | Painel de Pedidos</title>
<style>
:root{
  --bg:#09070f;--panel:#17121f;--panel2:#21182d;--line:#3b2a50;
  --purple:#9b5cff;--purple2:#6d28d9;--gold:#f3c75b;--gold2:#bd8629;
  --text:#fbf8ff;--muted:#b9accb;--green:#39d99b;--red:#ff657d;
}
*{box-sizing:border-box}
body{margin:0;padding:clamp(12px,3vw,28px);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:radial-gradient(ellipse at 50% -8%,#5b21b622,transparent 42%),linear-gradient(145deg,#08070d,#100c18 55%,#090810);min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:auto}
header{display:flex;justify-content:center;align-items:center;min-height:145px;padding:14px;margin:0 auto 18px;border:1px solid #f3c75b66;border-radius:20px;background:linear-gradient(135deg,#1b1128,#0d0a13 75%);box-shadow:0 16px 40px #0007;overflow:hidden}
.logo{display:block;width:min(100%,300px);max-height:200px;object-fit:contain;filter:drop-shadow(0 8px 20px #832bd533)}
.tabs{display:flex;gap:10px;margin-bottom:14px}
.tab{flex:1;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,#1a1425,#100d17);color:var(--muted);font-weight:800}
.tab.active{background:linear-gradient(135deg,#ffe18b,#e5b23c);color:#211707;border-color:#f5d273}
.panel{display:none;padding:clamp(15px,3vw,28px);border:1px solid #382746;border-radius:17px;background:linear-gradient(145deg,#1a1524,#100d17);box-shadow:0 14px 34px #0005}
.panel.active{display:block}
h2{font-size:clamp(21px,3vw,28px);color:var(--gold);margin:0 0 18px;padding-bottom:10px;border-bottom:1px solid #f4ce681f}
h3{color:#e2d3f7;font-size:16px;margin:24px 0 10px}
label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:5px 0}
input,textarea{width:100%;padding:13px 14px;border:1px solid #382b49;border-radius:11px;background:#0c0a12;color:white;outline:none}
input:focus,textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px #9b5cff20}
input::placeholder,textarea::placeholder{color:#80758f}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.full{grid-column:1/-1}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid transparent;border-radius:11px;padding:12px 15px;font-weight:800;transition:filter .15s,transform .15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.gold{background:linear-gradient(135deg,#ffe18b,#e5b23c);color:#211707;border-color:#f5d273}
.green{background:linear-gradient(135deg,#16543d,#217653);color:#e4fff1;border-color:#328c66}
.red{background:linear-gradient(135deg,#4a1d30,#76263e);color:#ffe6eb;border-color:#8f3652}
.purple{background:linear-gradient(135deg,#51258a,#7c3aed);color:#fff;border-color:#9b5cff}
.dark{background:#21182d;color:#e9def8;border-color:#49345e}
.wide{width:100%}
.notice{padding:13px 15px;margin:14px 0;border:1px solid #5a3a7a;border-radius:11px;background:#251a36;color:#e0d2f5}
.card{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px;margin:10px 0;border:1px solid #332640;border-radius:13px;background:linear-gradient(145deg,#1b1625,#14101c);box-shadow:0 6px 16px #0002}
.card .name{font-weight:750;overflow-wrap:anywhere;flex:1;min-width:120px}
.price{color:var(--gold);font-weight:850;white-space:nowrap}
.qty{display:flex;align-items:center;gap:7px}
.qty button{width:35px;height:35px;border-radius:10px;border:1px solid #49345e;background:#241a32;color:#fff;font-size:20px;font-weight:800}
.qty span{min-width:24px;text-align:center;color:var(--gold);font-weight:850}
.summary{margin:18px 0;padding:18px;border:1px solid #b98b3b;border-radius:14px;background:linear-gradient(135deg,#2a1c35,#17111f);color:#ffdc83}
.summaryline{display:flex;justify-content:space-between;gap:12px;margin:6px 0}
.summaryline.total{font-size:22px;font-weight:900;border-top:1px solid #b98b3b55;padding-top:10px;margin-top:10px}
.order-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.empty{padding:18px;text-align:center;color:#9e91b1;border:1px dashed #49345e;border-radius:12px;margin:10px 0}
.order-meta{font-size:13px;color:var(--muted);line-height:1.6;margin-top:6px;overflow-wrap:anywhere}
small{color:var(--muted)}
footer{text-align:center;color:#756a84;font-size:12px;margin:18px 0 4px}
@media(max-width:600px){
 body{padding:10px}.tabs{gap:7px}.tab{padding:12px 8px;font-size:13px}
 header{min-height:110px;padding:10px;border-radius:15px}.logo{width:min(100%,230px);max-height:150px}
 .grid{grid-template-columns:1fr}.full{grid-column:auto}.order-actions{grid-template-columns:1fr}
 .panel{padding:14px}.card{padding:12px}
}
@media print{
 body{background:#fff;color:#000;padding:0}
 header,.tabs,.no-print,footer{display:none!important}
 .panel{display:none!important;border:0;box-shadow:none;background:#fff;padding:0}
 #printArea{display:block!important}
}
</style>
</head>

}

}

function getFee(){return Math.max(0,Number(document.getElementById('fee').value)||0)}
