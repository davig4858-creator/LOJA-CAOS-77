<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ LOJA CAOS 77</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

:root{
  --bg: #0A101F;--card: #121A2E;--primaria: #7C3AED;
  --verde: #10B981;--ouro: #FBBF24;--amarelo: #F59E0B;--vermelho: #EF4444;
  --texto: #F1F5F9;--textoSec: #94A3B8;--borda: rgba(124,58,237,0.2);
}

body{background:var(--bg);min-height:100vh;color:var(--texto);padding-bottom:40px;}

.tela-login{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);display:flex;justify-content:center;align-items:center;z-index:999;}
.caixa-login{background:var(--card);border:1px solid var(--borda);border-radius:20px;padding:45px 30px;width:90%;max-width:400px;text-align:center;box-shadow:0 10px 40px rgba(124,58,237,0.15);}
.caixa-login h1{font-size:26px;font-weight:900;margin-bottom:8px;}
.caixa-login h1 span{color:var(--primaria);}
.caixa-login p{color:var(--textoSec);font-size:14px;margin-bottom:30px;}
.caixa-login input{width:100%;padding:14px 16px;background:rgba(0,0,0,0.3);border:1px solid var(--borda);border-radius:10px;color:var(--texto);font-size:15px;margin-bottom:16px;outline:none;text-align:center;}
.btn-login{width:100%;padding:14px;background:linear-gradient(90deg,var(--primaria),#3B82F6);border:none;border-radius:10px;color:white;font-size:15px;font-weight:800;cursor:pointer;margin-bottom:12px;}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(124,58,237,0.3);}
.btn-visita{width:100%;padding:12px;background:transparent;border:1px solid var(--textoSec);border-radius:10px;color:var(--textoSec);font-size:14px;font-weight:700;cursor:pointer;}
.btn-visita:hover{border-color:var(--primaria);color:var(--primaria);}
.dica-senha{font-size:11px;color:var(--textoSec);margin-top:16px;}

.header-top{background:linear-gradient(180deg,rgba(18,26,46,0.98),rgba(10,16,31,0.95));padding:16px;border-bottom:1px solid var(--borda);position:sticky;top:0;z-index:98;display:flex;justify-content:space-between;align-items:center;}
.header-top .title{font-size:18px;font-weight:900;}
.header-top .title span{color:var(--primaria);}
.status-badge{background:rgba(16,185,129,0.1);color:var(--verde);padding:6px 12px;border-radius:50px;font-size:12px;font-weight:700;}
.status-badge.nao-salvo{background:rgba(245,158,11,0.1);color:var(--amarelo);}
.btn-sair{padding:6px 12px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:6px;color:#FCA5A5;font-size:12px;font-weight:700;cursor:pointer;}

.container{max-width:1100px;margin:0 auto;padding:20px 14px;}
.section-card{background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:20px;margin-bottom:20px;}
.section-title{font-size:15px;font-weight:800;margin-bottom:16px;color:var(--primaria);}

.regras-box{background:rgba(124,58,237,0.05);border:1px solid rgba(124,58,237,0.15);border-radius:10px;padding:14px;margin-bottom:16px;}
.regras-titulo{font-weight:800;margin-bottom:10px;font-size:14px;}
.regras-linha{font-size:12px;margin-bottom:6px;line-height:1.6;}

.caixas-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.caixa-item{background:rgba(0,0,0,0.25);border-radius:10px;padding:14px;text-align:center;}
.caixa-label{font-size:11px;color:var(--textoSec);margin-bottom:6px;font-weight:600;text-transform:uppercase;}
.caixa-valor{font-size:18px;font-weight:900;}
.caixa-valor input{width:100%;background:transparent;border:none;font-size:18px;font-weight:900;text-align:center;outline:none;color:inherit;}
.ouro{color:var(--ouro);}.verde{color:var(--verde);}.azul{color:#3B82F6;}.vermelho{color:var(--vermelho);}

.desconto-row{display:flex;align-items:center;gap:10px;margin:12px 0;}
.desconto-row label{font-size:13px;color:var(--textoSec);font-weight:600;white-space:nowrap;}
.desconto-row input{width:70px;padding:6px 8px;background:rgba(0,0,0,0.3);border:1px solid var(--borda);border-radius:6px;color:var(--texto);font-size:14px;font-weight:700;text-align:center;outline:none;}

.btn-add{width:100%;padding:14px;background:linear-gradient(90deg,var(--primaria),#3B82F6);border:none;border-radius:10px;color:white;font-size:15px;font-weight:800;cursor:pointer;margin-bottom:12px;}
.btn-salvar{width:100%;padding:12px;background:linear-gradient(90deg,#8B5CF6,#EC4899);border:none;border-radius:10px;color:white;font-size:14px;font-weight:800;cursor:pointer;margin-bottom:16px;}
.btn-del{padding:5px 8px;background:linear-gradient(135deg,#450A0A,#7F1D1D);border:none;border-radius:5px;color:#FCA5A5;font-size:10px;font-weight:700;cursor:pointer;}

.membros-header{display:grid;grid-template-columns:160px repeat(7,40px) 80px 50px;gap:4px;padding:10px 8px;color:var(--primaria);font-size:9px;font-weight:800;text-transform:uppercase;border-bottom:1px solid var(--borda);margin-bottom:6px;text-align:center;}
.membros-header .nome-col{text-align:left;}

.membro-row{display:grid;grid-template-columns:160px repeat(7,40px) 80px 50px;gap:4px;padding:10px 8px;border-radius:8px;background:rgba(255,255,255,0.02);margin-bottom:6px;align-items:center;}
.membro-nome{font-size:13px;font-weight:700;color:var(--texto);}
.valor-cell input{width:100%;background:rgba(0,0,0,0.25);border:1px solid var(--borda);border-radius:4px;color:var(--verde);font-size:12px;font-weight:700;text-align:center;outline:none;padding:4px;}

.bolinha{width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,0.06);font-size:14px;transition:transform 0.15s ease;}
.bolinha:hover{transform:scale(1.1);}
.bolinha.verde{background:var(--verde);}
.bolinha.amarela{background:var(--amarelo);}
.bolinha.vermelha{background:var(--vermelho);}

.modal-fundo{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;justify-content:center;align-items:center;z-index:200;}
.modal{background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:24px;width:90%;max-width:420px;}
.modal h3{color:var(--primaria);margin-bottom:14px;font-size:16px;}
.modal input{width:100%;padding:12px;background:rgba(0,0,0,0.3);border:1px solid var(--borda);border-radius:8px;color:var(--texto);font-size:14px;margin-bottom:12px;outline:none;}
.modal-botoes{display:flex;gap:10px;margin-top:4px;}
.modal-btn-cancel{flex:1;padding:12px;background:#1E293B;border:none;border-radius:8px;color:white;font-weight:700;cursor:pointer;}
.modal-btn-save{flex:1;padding:12px;background:var(--verde);border:none;border-radius:8px;color:white;font-weight:700;cursor:pointer;}

.legenda{display:flex;gap:20px;flex-wrap:wrap;margin:12px 0;}
.leg-item{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--textoSec);}
.leg-bola{width:16px;height:16px;border-radius:50%;display:inline-block;}

@media(max-width:768px){
  .caixas-grid{grid-template-columns:1fr;}
  .membros-header,.membro-row{grid-template-columns:130px repeat(7,32px) 70px 40px;}
  .bolinha{width:24px;height:24px;font-size:12px;}
}
</style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div class="tela-login" id="telaLogin">
  <div class="caixa-login">
    <h1>⚡ <span>LOJA CAOS 77</span></h1>
    <p>Painel de Controle</p>
    <input type="password" id="senhaLogin" placeholder="Senha de Administrador">
    <button class="btn-login" onclick="fazerLogin()">🔐 ENTRAR COMO ADMIN</button>
    <button class="btn-visita" onclick="fazerVisita()">👀 ENTRAR COMO VISITANTE</button>
    <div class="dica-senha">💡 Senha: <strong>123477</strong></div>
  </div>
</div>

<!-- CABEÇALHO -->
<div class="header-top" id="barraTopo" style="display:none;">
  <div class="title">⚡ <span>LOJA CAOS 77</span></div>
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="status-badge" id="statusSinc">✅ Salvo</div>
    <button class="btn-sair" onclick="sair()">Sair</button>
  </div>
</div>

<!-- CONTEÚDO PRINCIPAL -->
<div class="container" id="conteudoPrincipal" style="display:none;">

<!-- REGRAS -->
<div class="section-card">
  <div class="section-title">📐 REGRAS</div>
  <div class="legenda">
    <div class="leg-item"><span class="leg-bola" style="background:var(--verde)"></span> Verde = ✅</div>
    <div class="leg-item"><span class="leg-bola" style="background:var(--amarelo)"></span> Amarelo = ⚠️</div>
    <div class="leg-item"><span class="leg-bola" style="background:var(--vermelho)"></span> Vermelho = ❌</div>
  </div>
</div>

<!-- CAIXAS -->
<div class="section-card">
  <div class="section-title">💰 CAIXAS</div>
  <div class="caixas-grid">
    <div class="caixa-item">
      <div class="caixa-label">Caixa da Facção</div>
      <div class="caixa-valor ouro"><input type="text" id="caixaFac" value="R$ 0,00" oninput="marcarAlterado()"></div>
    </div>
    <div class="caixa-item">
      <div class="caixa-label">Caixa de Pagamento</div>
      <div class="caixa-valor verde"><input type="text" id="caixaPagamento" value="R$ 0,00" oninput="marcarAlterado()"></div>
    </div>
    <div class="caixa-item">
      <div class="caixa-label">Desconto %</div>
      <div class="caixa-valor vermelho"><input type="number" id="descontoPerc" value="0" min="0" max="100" oninput="marcarAlterado()">%</div>
    </div>
  </div>
</div>

<!-- MEMBROS -->
<div class="section-card">
  <div class="section-title">👥 PARTICIPANTES DA SEMANA</div>
  
  <button class="btn-add" onclick="abrirModalMembro()">➕ ADICIONAR MEMBRO</button>
  <button class="btn-salvar" onclick="salvarDados()">💾 SALVAR</button>

  <div class="membros-header">
    <div class="nome-col">MEMBRO</div>
    <div>D1</div><div>D2</div><div>D3</div><div>D4</div><div>D5</div><div>D6</div><div>D7</div>
    <div>VALOR R$</div><div>✖</div>
  </div>

  <div id="listaMembros"></div>
</div>

</div>

<!-- MODAL ADICIONAR -->
<div class="modal-fundo" id="modalMembro">
  <div class="modal">
    <h3>➕ Adicionar Membro</h3>
    <input type="text" id="nomeNovo" placeholder="Nome do membro">
    <div class="modal-botoes">
      <button class="modal-btn-cancel" onclick="fecharModalMembro()">Cancelar</button>
      <button class="modal-btn-save" onclick="adicionarMembro()">Adicionar</button>
    </div>
  </div>
</div>

<script>
const SENHA_ADMIN = '123477';
let modoAdmin = false;
let membros = [];
let alterado = false;

// --- UTILITÁRIOS ---
function formatarDinheiro(valor) {
  return 'R$ ' + parseFloat(valor).toFixed(2).replace('.', ',');
}

function marcarAlterado() {
  alterado = true;
  document.getElementById('statusSinc').textContent = '⚠️ Não Salvo';
  document.getElementById('statusSinc').classList.add('nao-salvo');
}

// --- LOGIN ---
function fazerLogin() {
  const senha = document.getElementById('senhaLogin').value;
  if (senha === SENHA_ADMIN) {
    modoAdmin = true;
    abrirPainel();
  } else {
    alert('❌ Senha incorreta!');
  }
}

function fazerVisita() {
  modoAdmin = false;
  abrirPainel();
}

function abrirPainel() {
  document.getElementById('telaLogin').style.display = 'none';
  document.getElementById('barraTopo').style.display = 'flex';
  document.getElementById('conteudoPrincipal').style.display = 'block';
  
  if (!modoAdmin) {
    document.getElementById('btnAdicionar').style.display = 'none';
    document.getElementById('btnSalvar').style.display = 'none';
    document.getElementById('descontoPerc').disabled = true;
    document.getElementById('caixaFac').disabled = true;
    document.getElementById('caixaPagamento').disabled = true;
  } else {
    document.getElementById('btnAdicionar').style.display = 'block';
    document.getElementById('btnSalvar').style.display = 'block';
    document.getElementById('descontoPerc').disabled = false;
    document.getElementById('caixaFac').disabled = false;
    document.getElementById('caixaPagamento').disabled = false;
  }
  
  carregarDados();
  renderizarLista();
}

function sair() {
  if (alterado && confirm('Salvar alterações antes de sair?')) salvarDados();
  modoAdmin = false;
  document.getElementById('senhaLogin').value = '';
  document.getElementById('telaLogin').style.display = 'flex';
  document.getElementById('barraTopo').style.display = 'none';
  document.getElementById('conteudoPrincipal').style.display = 'none';
}

// --- MODAL ---
function abrirModalMembro() {
  document.getElementById('modalMembro').style.display = 'flex';
}

function fecharModalMembro() {
  document.getElementById('modalMembro').style.display = 'none';
  document.getElementById('nomeNovo').value = '';
}

function adicionarMembro() {
  const nome = document.getElementById('nomeNovo').value.trim();
  if (!nome) { alert('Digite o nome!'); return; }
  
  membros.push({
    id: Date.now(),
    nome: nome,
    dias: ['', '', '', '', '', '', ''],
    valor: ''
  });
  
  fecharModalMembro();
  marcarAlterado();
  renderizarLista();
}

function removerMembro(id) {
  if (!modoAdmin) return;
  if (confirm('Remover este membro?')) {
    membros = membros.filter(m => m.id !== id);
    marcarAlterado();
    renderizarLista();
  }
}

// --- TROCAR COR DA BOLINHA ---
function trocarBolinha(id, diaIndex) {
  if (!modoAdmin) return;
  const membro = membros.find(m => m.id === id);
  if (!membro) return;
  
  const estados = ['', 'verde', 'amarelo', 'vermelho'];
  const atual = membro.dias[diaIndex];
  const proximoIndex = (estados.indexOf(atual) + 1) % estados.length;
  membro.dias[diaIndex] = estados[proximoIndex];
  
  marcarAlterado();
  renderizarLista();
}

// --- ATUALIZAR VALOR DO MEMBRO ---
function atualizarValor(id, valor) {
  const membro = membros.find(m => m.id === id);
  if (membro) {
    membro.valor = valor;
    marcarAlterado();
  }
}

// --- RENDERIZAR LISTA ---
function renderizarLista() {
  let html = '';
  membros.forEach(m => {
    html += `<div class="membro-row">
      <div class="membro-nome">${m.nome}</div>`;
    
    // 7 dias de bolinhas
    m.dias.forEach((cor, i) => {
      let classe = '';
      let emoji = '';
      if (cor === 'verde') { classe = 'verde'; emoji = '🟢'; }
      else if (cor === 'amarelo') { classe = 'amarelo'; emoji = '🟡'; }
      else if (cor === 'vermelho') { classe = 'vermelho'; emoji = '🔴'; }
      
      html += `<button class="bolinha ${classe}" onclick="trocarBolinha(${m.id}, ${i})" ${!modoAdmin ? 'disabled' : ''}>${emoji}</button>`;
    });
    
    html += `
      <div class="valor-cell">
        <input type="text" value="${m.valor}" placeholder="R$ 0,00" 
               oninput="atualizarValor(${m.id}, this.value)" ${!modoAdmin ? 'disabled' : ''}>
      </div>
      <div>${modoAdmin ? `<button class="btn-del" onclick="removerMembro(${m.id})">✖</button>` : ''}</div>
    </div>`;
  });
  
  document.getElementById('listaMembros').innerHTML = html;
}

// --- SALVAR / CARREGAR ---
function salvarDados() {
  const dados = {
    membros: membros,
    caixaFac: document.getElementById('caixaFac').value,
    caixaPagamento: document.getElementById('caixaPagamento').value,
    descontoPerc: document.getElementById('descontoPerc').value
  };
  localStorage.setItem('caos77_dados', JSON.stringify(dados));
  alterado = false;
  document.getElementById('statusSinc').textContent = '✅ Salvo';
  document.getElementById('statusSinc').classList.remove('nao-salvo');
  alert('✅ Salvo com sucesso!');
}

function carregarDados() {
  const salvo = localStorage.getItem('caos77_dados');
  if (salvo) {
    try {
      const dados = JSON.parse(salvo);
      membros = dados.membros || [];
      document.getElementById('caixaFac').value = dados.caixaFac || 'R$ 0,00';
      document.getElementById('caixaPagamento').value = dados.caixaPagamento || 'R$ 0,00';
      document.getElementById('descontoPerc').value = dados.descontoPerc || 0;
    } catch(e) { console.log('Erro ao carregar'); }
  }
  alterado = false;
  document.getElementById('statusSinc').textContent = '✅ Salvo';
  document.getElementById('statusSinc').classList.remove('nao-salvo');
}

document.getElementById('nomeNovo').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') adicionarMembro();
});
</script>

</body>
</html>
