<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DK HAMBURGUERIA — Painel</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Roboto, sans-serif;
}
body {
  background: #080418;
  color: #ffffff;
  min-height: 100vh;
  padding: 12px;
}
.topo {
  text-align: center;
  padding: 22px;
  border-radius: 16px;
  border: 2px solid #D4AF37;
  background: linear-gradient(135deg, #250650, #5a109b);
  box-shadow: 0 0 18px #7b2cbf;
  margin-bottom: 16px;
}
.topo h1 {
  color: #D4AF37;
  font-size: 28px;
  text-shadow: 0 0 6px #D4AF37;
}
.abas {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
}
.botaoAba {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 10px 10px 0 0;
  font-weight: bold;
  background: #220b44;
  color: #fff;
  cursor: pointer;
  transition: 0.2s;
}
.botaoAba.ativa {
  background: #D4AF37;
  color: #000;
  box-shadow: 0 0 10px #D4AF37;
}
.conteudoAba {
  display: none;
  background: #14072b;
  border: 1px solid #7b2cbf;
  border-radius: 0 14px 14px 14px;
  padding: 16px;
  box-shadow: 0 0 14px #3c1270;
}
.conteudoAba.visivel {
  display: block;
}
h2 {
  color: #D4AF37;
  margin-bottom: 12px;
}
h3 {
  margin: 14px 0 6px;
}
input {
  width: 100%;
  padding: 11px;
  border-radius: 8px;
  border: 1px solid #7b2cbf;
  background: #0b041b;
  color: #fff;
  margin: 6px 0;
}
.botao {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 9px;
  font-weight: bold;
  margin: 7px 0;
  cursor: pointer;
  font-size: 15px;
}
.botaoDourado {
  background: #D4AF37;
  color: #000;
  box-shadow: 0 0 8px #D4AF37;
}
.botaoVerde {
  background: #2cc95b;
  color: #000;
}
.botaoVermelho {
  background: #e63946;
  color: #fff;
}
.botaoMais {
  background: #2cc95b;
  color: #000;
  font-weight: bold;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  border: none;
  font-size: 22px;
  cursor: pointer;
  margin: 0 2px;
}
.botaoMenos {
  background: #e63946;
  color: #fff;
  font-weight: bold;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  border: none;
  font-size: 22px;
  cursor: pointer;
  margin: 0 2px;
}
.item {
  background: #200d3f;
  border: 1px solid #D4AF37;
  border-radius: 10px;
  padding: 12px;
  margin: 9px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.quantidadeItem {
  background: #110622;
  border: 1px solid #D4AF37;
  padding: 6px 12px;
  border-radius: 8px;
  margin: 0 6px;
  font-weight: bold;
  min-width: 36px;
  text-align: center;
}
.totalDia {
  background: #1f0b3b;
  border: 2px solid #D4AF37;
  border-radius: 10px;
  padding: 14px;
  margin: 12px 0;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  color: #D4AF37;
}
.historicoPedido {
  background: #0f0520;
  border: 1px solid #D4AF37;
  border-radius: 10px;
  padding: 12px;
  margin: 10px 0;
}
.botoesQuantidade {
  display: flex;
  align-items: center;
}
.aviso {
  background: #2a1055;
  border: 1px solid #7b2cbf;
  border-radius: 8px;
  padding: 10px;
  margin: 10px 0;
  font-size: 14px;
  color: #e0c9ff;
}
</style>
</head>
<body>
<div class="topo">
  <h1>DK HAMBURGUERIA</h1>
</div>

<div class="abas">
  <button class="botaoAba ativa" onclick="mudarAba(0)">📋 Lançar Pedidos</button>
  <button class="botaoAba" onclick="mudarAba(1)">🍔 Cadastrar Lanches</button>
</div>

<div class="conteudoAba visivel" id="aba0">
  <h2>Novo Pedido</h2>
  
  <input type="text" id="nomeCliente" placeholder="Nome do cliente">
  <input type="text" id="enderecoCliente" placeholder="Endereço">
  <input type="number" id="taxaEntrega" step="0.01" placeholder="Taxa de Entrega R$">

  <div class="aviso">
    🎁 Combo do dia — digite o nome e o valor abaixo:
  </div>
  
  <input type="text" id="nomeCombo" placeholder="Nome do Combo (ex: Combo Terça)">
  <input type="number" id="valorCombo" step="0.01" placeholder="Valor R$">
  <button class="botao botaoVerde" onclick="adicionarComboAoPedido()">➕ Adicionar Combo ao Pedido</button>

  <h3>🍔 Lanches disponíveis:</h3>
  <div id="listaLanchesPedido"></div>

  <h3>📝 Itens do pedido:</h3>
  <div id="itensDoPedido"></div>

  <div class="totalDia">
    💰 Total vendido no dia: R$ <span id="somaDia">0.00</span>
  </div>

  <button class="botao botaoVerde" onclick="finalizarPedido()">✅ Finalizar Pedido</button>
  <button class="botao botaoDourado" onclick="imprimirPedido()">🖨️ Imprimir Pedido</button>
  <button class="botao botaoDourado" onclick="salvarEDownloadDia()">💾 Salvar e baixar vendas do dia</button>
  <button class="botao botaoVermelho" onclick="limparHistoricoDia()">🗑️ Limpar histórico para o próximo dia</button>

  <h3>📜 Histórico de pedidos do dia:</h3>
  <div id="historicoPedidos"></div>
</div>

<div class="conteudoAba" id="aba1">
  <h2>Cadastrar Lanches do Cardápio</h2>
  <input type="text" id="nomeLancheNovo" placeholder="Ex: Dk JR">
  <input type="number" id="precoLancheNovo" step="0.01" placeholder="Ex: 17.99">
  <button class="botao botaoDourado" onclick="cadastrarLanche()">➕ Cadastrar Lanche</button>

  <h3>📋 Lanches cadastrados:</h3>
  <div id="listaLanchesCadastrados"></div>
</div>

<script>
let abaAtual = 0;
let lanches = [];
let itensPedidoAtual = [];
let historicoPedidos = [];

function salvarLocal(chave, valor) {
  try {
    localStorage.setItem(chave, JSON.stringify(valor));
    return true;
  } catch (e) {
    console.error('Erro ao salvar:', e);
    return false;
  }
}

function carregarLocal(chave) {
  try {
    const dados = localStorage.getItem(chave);
    return dados ? JSON.parse(dados) : [];
  } catch (e) {
    console.error('Erro ao carregar:', e);
    return [];
  }
}

function baixarArquivoTexto(nomeArquivo, conteudoTexto) {
  const blob = new Blob([conteudoTexto], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nomeArquivo;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.addEventListener('DOMContentLoaded', function() {
  lanches = carregarLocal('lanches');
  historicoPedidos = carregarLocal('historicoPedidos');
  mudarAba(0);
});

function mudarAba(numero) {
  abaAtual = numero;
  document.querySelectorAll('.conteudoAba').forEach((el, i) => {
    el.classList.toggle('visivel', i === numero);
  });
  document.querySelectorAll('.botaoAba').forEach((el, i) => {
    el.classList.toggle('ativa', i === numero);
  });
  carregarLanchesPedido();
  carregarListaCadastrados();
  carregarHistorico();
  calcularTotalDoDia();
}

// ===== COMBOS =====
function adicionarComboAoPedido() {
  const nomeCombo = document.getElementById('nomeCombo').value.trim();
  const valorCombo = Number(document.getElementById('valorCombo').value);

  if (!nomeCombo || !valorCombo || valorCombo <= 0) {
    alert('⚠️ Preencha o nome e o valor do combo corretamente!');
    return;
  }

  itensPedidoAtual.push({ nome: '🎁 ' + nomeCombo, preco: valorCombo });
  
  document.getElementById('nomeCombo').value = '';
  document.getElementById('valorCombo').value = '';
  
  atualizarItensPedido();
  alert('✅ Combo adicionado ao pedido!');
}

// ===== LANCHES =====
function carregarLanchesPedido() {
  const div = document.getElementById('listaLanchesPedido');
  div.innerHTML = '';
  lanches.forEach(l => {
    const qtd = contarItemPedido(l.nome);
    div.innerHTML += `
      <div class="item">
        <span>${l.nome} — R$ ${Number(l.preco).toFixed(2)}</span>
        <div class="botoesQuantidade">
          <button class="botaoMenos" onclick="removerUmDoPedido('${l.nome}')">−</button>
          <span class="quantidadeItem">${qtd}</span>
          <button class="botaoMais" onclick="adicionarAoPedido('${l.nome}', ${l.preco})">+</button>
        </div>
      </div>
    `;
  });
}

function contarItemPedido(nome) {
  return itensPedidoAtual.filter(i => i.nome === nome).length;
}

function adicionarAoPedido(nome, preco) {
  itensPedidoAtual.push({nome, preco});
  atualizarItensPedido();
  carregarLanchesPedido();
}

function removerUmDoPedido(nome) {
  const indice = itensPedidoAtual.findIndex(i => i.nome === nome);
  if (indice !== -1) {
    itensPedidoAtual.splice(indice, 1);
    atualizarItensPedido();
    carregarLanchesPedido();
  }
}

// ===== ITENS DO PEDIDO =====
function atualizarItensPedido() {
  const div = document.getElementById('itensDoPedido');
  div.innerHTML = '';
  itensPedidoAtual.forEach((item, i) => {
    div.innerHTML += `
      <div class="item">
        <span>${item.nome} — R$ ${item.preco.toFixed(2)}</span>
        <button class="botao botaoVermelho" style="width:auto;padding:8px 12px;" onclick="removerItem(${i})">Remover</button>
      </div>
    `;
  });
}

function removerItem(indice) {
  itensPedidoAtual.splice(indice, 1);
  atualizarItensPedido();
  carregarLanchesPedido();
}

// ===== PEDIDOS =====
function finalizarPedido() {
  const nomeCli = document.getElementById('nomeCliente').value.trim();
  const endCli = document.getElementById('enderecoCliente').value.trim();
  const taxaEntrega = Number(document.getElementById('taxaEntrega').value) || 0;

  if (!nomeCli || itensPedidoAtual.length === 0) {
    alert('⚠️ Preencha o nome do cliente e adicione os itens!');
    return;
  }

  let valorTotal = 0;
  itensPedidoAtual.forEach(i => valorTotal += i.preco);
  valorTotal += taxaEntrega;

  const pedido = {
    dataHora: new Date().toLocaleString('pt-BR'),
    nomeCliente: nomeCli,
    endereco: endCli,
    taxaEntrega: taxaEntrega,
    itens: [...itensPedidoAtual],
    total: valorTotal
  };

  historicoPedidos.push(pedido);
  salvarLocal('historicoPedidos', historicoPedidos);

  carregarHistorico();
  calcularTotalDoDia();

  itensPedidoAtual = [];
  document.getElementById('nomeCliente').value = '';
  document.getElementById('enderecoCliente').value = '';
  document.getElementById('taxaEntrega').value = '';
  atualizarItensPedido();
  carregarLanchesPedido();

  alert('✅ Pedido finalizado!');
}

function calcularTotalDoDia() {
  let total = 0;
  historicoPedidos.forEach(ped => {
    total += ped.total;
  });
  document.getElementById('somaDia').textContent = total.toFixed(2);
  salvarLocal('vendasDia', total);
}

function carregarHistorico() {
  const div = document.getElementById('historicoPedidos');
  div.innerHTML = '';
  historicoPedidos.forEach((ped, indice) => {
    let itensTexto = '';
    ped.itens.forEach(i => {
      itensTexto += i.nome + ' R$ ' + i.preco.toFixed(2) + '<br>';
    });
    div.innerHTML += `
      <div class="historicoPedido">
        <strong>DK HAMBURGUERIA</strong><br>
        ${ped.dataHora}<br>
        <strong>Cliente: ${ped.nomeCliente}</strong><br>
        Endereço: ${ped.endereco}<br>
        Taxa de Entrega: R$ ${ped.taxaEntrega.toFixed(2)}<br>
        ${itensTexto}
        <strong>TOTAL: R$ ${ped.total.toFixed(2)}</strong><br>
        <button class="botao botaoVermelho" style="margin-top:8px;" onclick="excluirPedidoDoDia(${indice})">🗑️ Excluir este pedido</button>
      </div>
    `;
  });
}

function excluirPedidoDoDia(indice) {
  if (!confirm('⚠️ Tem certeza que deseja excluir este pedido?')) return;
  historicoPedidos.splice(indice, 1);
  salvarLocal('historicoPedidos', historicoPedidos);
  carregarHistorico();
  calcularTotalDoDia();
}

function imprimirPedido() {
  const nomeCli = document.getElementById('nomeCliente').value;
  const endCli = document.getElementById('enderecoCliente').value;
  const taxaEntrega = Number(document.getElementById('taxaEntrega').value) || 0;
  let totalPedido = 0;

  let texto = 'DK HAMBURGUERIA\n';
  texto += '-------------------------\n';
  texto += 'CLIENTE: ' + nomeCli + '\n';
  texto += 'ENDEREÇO: ' + endCli + '\n';
  texto += 'TAXA DE ENTREGA: R$ ' + taxaEntrega.toFixed(2) + '\n';
  texto += '-------------------------\n';

  itensPedidoAtual.forEach(i => {
    texto += i.nome + '  R$ ' + i.preco.toFixed(2) + '\n';
    totalPedido += i.preco;
  });

  totalPedido += taxaEntrega;
  texto += '-------------------------\n';
  texto += 'TOTAL: R$ ' + totalPedido.toFixed(2) + '\n';
  texto += '-------------------------\n';

  const linkRawbt = 'rawbt://print?text=' + encodeURIComponent(texto);
  window.location.href = linkRawbt;
}

function salvarEDownloadDia() {
  calcularTotalDoDia();
  const dataArquivo = new Date().toLocaleDateString('pt-BR').replace(/\//g, '-');
  let relatorio = '';
  relatorio += 'DK HAMBURGUERIA - RELATÓRIO DE VENDAS\n';
  relatorio += 'Gerado em: ' + new Date().toLocaleString('pt-BR') + '\n';
  relatorio += 'Quantidade de pedidos: ' + historicoPedidos.length + '\n';
  relatorio += '----------------------------------------\n';

  for(let indice = 0; indice < historicoPedidos.length; indice++){
    const ped = historicoPedidos[indice];
    relatorio += 'PEDIDO ' + (indice + 1) + '\n';
    relatorio += 'Data/Hora: ' + ped.dataHora + '\n';
    relatorio += 'Cliente: ' + ped.nomeCliente + '\n';
    relatorio += 'Endereço: ' + ped.endereco + '\n';
    relatorio += 'Taxa de Entrega: R$ ' + ped.taxaEntrega.toFixed(2) + '\n';
    relatorio += 'Itens: \n';
    ped.itens.forEach(item => {
      relatorio += '  - ' + item.nome + '  R$ ' + item.preco.toFixed(2) + '\n';
    });
    relatorio += 'TOTAL DO PEDIDO: R$ ' + ped.total.toFixed(2) + '\n';
    relatorio += '----------------------------------------\n';
  }

  let totalGeral = 0;
  historicoPedidos.forEach(p => totalGeral += p.total);
  relatorio += 'TOTAL GERAL DO DIA: R$ ' + totalGeral.toFixed(2) + '\n';

  baixarArquivoTexto('todas_vendas_' + dataArquivo + '.txt', relatorio);
  alert('💾 Relatório baixado com sucesso!');
}

function limparHistoricoDia() {
  if (!confirm('⚠️ Primeiro faça o download do relatório! Tem certeza que deseja limpar tudo?')) return;
  historicoPedidos = [];
  salvarLocal('historicoPedidos', historicoPedidos);
  carregarHistorico();
  calcularTotalDoDia();
  alert('🗑️ Histórico limpo! Pronto para o próximo dia!');
}

function cadastrarLanche() {
  const nomeInput = document.getElementById('nomeLancheNovo');
  const precoInput = document.getElementById('precoLancheNovo');
  const nome = nomeInput.value.trim();
  const preco = Number(precoInput.value);

  if (!nome || !preco || preco <= 0) {
    alert('⚠️ Preencha o nome e um preço válido!');
    return;
  }

  lanches.push({nome: nome, preco: preco});
  salvarLocal('lanches', lanches);

  nomeInput.value = '';
  precoInput.value = '';

  carregarLanchesPedido();
  carregarListaCadastrados();
  alert('✅ Lanche cadastrado!');
}

function carregarListaCadastrados() {
  const div = document.getElementById('listaLanchesCadastrados');
  div.innerHTML = '';
  lanches.forEach((l
