<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DK HAMBURGUERIA</title>
<style>
body {background:#2E1050; color:#fff; font-family:Arial; padding:20px; max-width:500px; margin:0 auto;}
h1 {text-align:center; color:#D4AF37;}
h2 {color:#D4AF37; font-size:18px; margin-top:25px;}
input {width:100%; padding:10px; margin:5px 0; border-radius:5px; border:1px solid #D4AF37; background:rgba(255,255,255,0.1); color:#fff;}
button {padding:10px 15px; border:none; border-radius:5px; font-weight:bold; cursor:pointer; margin:3px;}
.btn-add {background:#D4AF37; color:#000; width:100%; margin-top:8px;}
.btn-verde {background:#006400; color:#fff;}
.btn-roxo {background:#4B0082; color:#fff;}
.btn-vermelho {background:#8B0000; color:#fff;}
.btn-azul {background:#0066CC; color:#fff;}
.linha {display:flex; justify-content:space-between; align-items:center; padding:8px; background:rgba(75,0,130,0.3); border-radius:5px; margin:5px 0;}
.valor {color:#D4AF37; font-weight:bold;}
.vazio {color:#888; text-align:center; padding:20px;}
.total {padding:10px; background:rgba(212,175,55,0.2); border-radius:5px; font-weight:bold; text-align:right; color:#D4AF37; margin-top:10px;}
.controle {display:flex; gap:5px; align-items:center;}
.controle button {width:30px; padding:5px;}
.botoes {display:flex; flex-wrap:wrap; gap:5px; margin-top:10px;}
.botoes button {flex:1; min-width:80px;}
</style>
</head>
<body>

<h1>🍔 DK HAMBURGUERIA</h1>

<h2>📋 Cadastrar Lanche</h2>
<input type="text" id="nomeInput" placeholder="Nome do lanche">
<input type="number" id="valorInput" placeholder="Preço" step="0.01">
<button class="btn-add" onclick="adicionarLanche()">➕ Adicionar ao Cardápio</button>

<h3>Cardápio</h3>
<div id="listaCardapio" class="vazio">Nenhum lanche cadastrado</div>

<h2>🛒 Novo Pedido</h2>
<input type="text" id="clienteInput" placeholder="Nome do Cliente">
<div id="listaPedidos" class="vazio">Cadastre lanches primeiro</div>
<div class="total">Total: R$ <span id="totalGeral">0.00</span></div>
<div class="botoes">
  <button class="btn-vermelho" onclick="limparPedido()">🗑️ Limpar</button>
  <button class="btn-azul" onclick="imprimir()">🖨️ Imprimir</button>
  <button class="btn-roxo" onclick="copiar()">📋 Copiar</button>
  <button class="btn-verde" onclick="finalizar()">✅ Finalizar</button>
</div>

<h2>📊 Vendas</h2>
<input type="date" id="dataFiltro">
<div class="botoes">
  <button class="btn-azul" onclick="filtrar()">🔍 Filtrar</button>
  <button class="btn-roxo" onclick="hoje()">Hoje</button>
</div>
<div class="botoes">
  <button class="btn-azul" onclick="salvarTudo()">📁 Salvar Tudo</button>
  <button class="btn-roxo" onclick="salvarDia()">💾 Salvar Dia</button>
</div>
<div id="listaVendas" class="vazio">Nenhuma venda ainda</div>
<button class="btn-vermelho" style="width:100%; margin-top:10px;" onclick="limparHistorico()">⚠️ Limpar Histórico</button>

<script>
let cardapio = JSON.parse(localStorage.getItem('dk_cardapio')) || [];
let vendas = JSON.parse(localStorage.getItem('dk_vendas')) || [];
let pedido = [];

function salvarCardapio() {
  localStorage.setItem('dk_cardapio', JSON.stringify(cardapio));
}
function salvarVendas() {
  localStorage.setItem('dk_vendas', JSON.stringify(vendas));
}
function hojeData() {
  return new Date().toISOString().split('T')[0];
}

document.getElementById('dataFiltro').value = hojeData();
atualizarCardapio();
atualizarPedidos();
atualizarVendas();

function adicionarLanche() {
  const nome = document.getElementById('nomeInput').value.trim();
  const valor = parseFloat(document.getElementById('valorInput').value);
  
  if (!nome) { alert('Digite o nome!'); return; }
  if (!valor || valor <= 0) { alert('Digite um preço válido!'); return; }
  
  cardapio.push({nome: nome, valor: valor});
  salvarCardapio();
  atualizarCardapio();
  atualizarPedidos();
  
  document.getElementById('nomeInput').value = '';
  document.getElementById('valorInput').value = '';
  alert('✅ Lanche cadastrado!');
}

function removerLanche(i) {
  if (confirm('Excluir?')) {
    cardapio.splice(i, 1);
    salvarCardapio();
    atualizarCardapio();
    atualizarPedidos();
  }
}

function atualizarCardapio() {
  const div = document.getElementById('listaCardapio');
  if (cardapio.length === 0) {
    div.innerHTML = '<div class="vazio">Nenhum lanche cadastrado</div>';
    return;
  }
  div.innerHTML = '';
  cardapio.forEach((lanche, i) => {
    div.innerHTML += `
      <div class="linha">
        <span>${lanche.nome}</span>
        <span class="valor">R$ ${lanche.valor.toFixed(2)}</span>
        <button class="btn-vermelho" style="padding:3px 8px;" onclick="removerLanche(${i})">✕</button>
      </div>
    `;
  });
}

function atualizarPedidos() {
  const div = document.getElementById('listaPedidos');
  if (cardapio.length === 0) {
    div.innerHTML = '<div class="vazio">Cadastre lanches primeiro</div>';
    document.getElementById('totalGeral').textContent = '0.00';
    return;
  }
  div.innerHTML = '';
  cardapio.forEach((lanche, i) => {
    const qtd = pedido.filter(p => p.indice === i).length;
    div.innerHTML += `
      <div class="linha">
        <span>${lanche.nome} — R$ ${lanche.valor.toFixed(2)}</span>
        <div class="controle">
          <button onclick="menos(${i})">−</button>
          <span>${qtd}</span>
          <button onclick="mais(${i})">+</button>
        </div>
      </div>
    `;
  });
  const total = pedido.reduce((soma, item) => soma + item.valor, 0);
  document.getElementById('totalGeral').textContent = total.toFixed(2);
}

function mais(i) {
  pedido.push({indice: i, nome: cardapio[i].nome, valor: cardapio[i].valor});
  atualizarPedidos();
}

function menos(i) {
  const pos = pedido.findIndex(p => p.indice === i);
  if (pos !== -1) { pedido.splice(pos, 1); atualizarPedidos(); }
}

function limparPedido() {
  if (pedido.length > 0 && !confirm('Limpar pedido?')) return;
  pedido = [];
  document.getElementById('clienteInput').value = '';
  atualizarPedidos();
}

// ✅ CUPOM MELHORADO
function gerarCupom() {
  if (pedido.length === 0) return '';
  const cliente = document.getElementById('clienteInput').value.trim() || 'Cliente';
  const agora = new Date();
  const data = agora.toLocaleDateString('pt-BR');
  const hora = agora.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});

  const agrupado = {};
  pedido.forEach(item => {
    if (!agrupado[item.nome]) agrupado[item.nome] = {qtd:0, valor:item.valor};
    agrupado[item.nome].qtd++;
  });
  const total = pedido.reduce((soma, item) => soma + item.valor, 0);

  let cupom = "==============================\n";
  cupom += "       DK HAMBURGUERIA\n";
  cupom += "==============================\n";
  cupom += `DATA: ${data.padEnd(14)} HORA: ${hora}\n`;
  cupom += `CLIENTE: ${cliente}\n`;
  cupom += "==============================\n";
  cupom += "DESCRICAO         QTD  VALOR\n";
  cupom += "------------------------------\n";
  
  for (const nome in agrupado) {
    const sub = agrupado[nome].valor * agrupado[nome].qtd;
    const nomeCurto = nome.length > 16 ? nome.substring(0,16) : nome;
    cupom += `${nomeCurto.padEnd(16)} ${String(agrupado[nome].qtd).padStart(3)}  R$${sub.toFixed(2).padStart(6)}\n`;
  }
  
  cupom += "------------------------------\n";
  cupom += `TOTAL:                R$ ${total.toFixed(2)}\n`;
  cupom += "==============================\n";
  cupom += "    Obrigado! Volte Sempre!\n";
  cupom += "\n\n\n";
  return cupom;
}

function copiar() {
  const texto = gerarCupom();
  if (!texto) { alert('Adicione itens primeiro!'); return; }
  navigator.clipboard.writeText(texto).then(() => alert('✅ Cupom copiado!'));
}

function imprimir() {
  const texto = gerarCupom();
  if (!texto) { alert('Adicione itens primeiro!'); return; }
  navigator.clipboard.writeText(texto).then(() => {
    alert('✅ Pronto! Abra o RawBT e imprima');
    window.location.href = 'rawbt://print?text=' + encodeURIComponent(texto);
  });
}

function finalizar() {
  if (pedido.length === 0) { alert('Adicione itens primeiro!'); return; }
  const cliente = document.getElementById('clienteInput').value.trim() || 'Sem nome';
  const total = pedido.reduce((soma, item) => soma + item.valor, 0);
  const agora = new Date();
  const dataISO = agora.toISOString().split('T')[0];
  
  const agrupado = {};
  pedido.forEach(item => {
    if (!agrupado[item.nome]) agrupado[item.nome] = {qtd:0, valor:item.valor};
    agrupado[item.nome].qtd++;
  });
  
  vendas.unshift({
    id: Date.now(),
    data: dataISO,
    dataStr: agora.toLocaleDateString('pt-BR'),
    hora: agora.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}),
    cliente: cliente,
    itens: agrupado,
    total: total
  });
  salvarVendas();
  alert('✅ Pedido salvo! Total: R$ ' + total.toFixed(2));
  
  pedido = [];
  document.getElementById('clienteInput').value = '';
  atualizarPedidos();
  atualizarVendas();
}

function baixarArquivo(conteudo, nome) {
  const blob = new Blob([conteudo], {type: 'text/plain;charset=utf-8'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = nome;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function salvarTudo() {
  if (vendas.length === 0) { alert('Nenhuma venda!'); return; }
  const agora = new Date();
  const dataArq = agora.toLocaleDateString('pt-BR').replace(/\//g, '-');
  let texto = '==============================\n';
  texto += '   RELATÓRIO GERAL\n';
  texto += '==============================\n';
  texto += 'Gerado em: ' + agora.toLocaleString('pt-BR') + '\n';
  texto += 'Total de vendas: ' + vendas.length + '\n';
  texto += '==============================\n\n';
  let totalGeral = 0;
  vendas.forEach((v, i) => {
    totalGeral += v.total;
    texto += (i+1) + '. ' + v.dataStr + ' ' + v.hora + ' | ' + v.cliente + '\n';
    for (const nome in v.itens) {
      texto += '   ' + nome + ' x' + v.itens[nome].qtd + ' = R$ ' + (v.itens[nome].valor * v.itens[nome].qtd).toFixed(2) + '\n';
    }
    texto += '   TOTAL: R$ ' + v.total.toFixed(2) + '\n';
    texto += '------------------------------\n';
  });
  texto += '\nTOTAL GERAL: R$ ' + totalGeral.toFixed(2) + '\n';
  baixarArquivo(texto, 'todas_vendas_' + dataArq + '.txt');
  alert('✅ Salvo!');
}

function salvarDia() {
  const data = document.getElementById('dataFiltro').value;
  if (!data) { alert('Escolha uma data!'); return; }
  const vendasDia = vendas.filter(v => v.data === data);
  if (vendasDia.length === 0) { alert('Nenhuma venda neste dia!'); return; }
  const dt = data.split('-').reverse().join('/');
  let texto = '==============================\n';
  texto += '   VENDAS DO DIA ' + dt + '\n';
  texto += '==============================\n\n';
  let totalDia = 0;
  vendasDia.forEach((v, i) => {
    totalDia += v.total;
    texto += (i+1) + '. ' + v.hora + ' | ' + v.cliente + '\n';
    for (const nome in v.itens) {
      texto += '   ' + nome + ' x' + v.itens[nome].qtd + ' = R$ ' + (v.itens[nome].valor * v.itens[nome].qtd).toFixed(2) + '\n';
    }
    texto += '   TOTAL: R$ ' + v.total.toFixed(2) + '\n';
    texto += '------------------------------\n';
  });
  texto += '\nTOTAL DO DIA: R$ ' + totalDia.toFixed(2) + '\n';
  baixarArquivo(texto, 'vendas_dia_' + dt.replace(/\//g, '-') + '.txt');
  alert('✅ Salvo!');
}

function apagarVenda(id) {
  if (confirm('Excluir venda?')) {
    vendas = vendas.filter(v => v.id !== id);
    salvarVendas();
    atualizarVendas();
  }
}

function limparHistorico() {
  if (!confirm('Apagar TODAS as vendas?')) return;
  vendas = [];
  salvarVendas();
  atualizarVendas();
}

function filtrar() {
  atualizarVendas(document.getElementById('dataFiltro').value);
}

function hoje() {
  document.getElementById('dataFiltro').value = hojeData();
  atualizarVendas(hojeData());
}

function atualizarVendas(filtroData) {
  const div = document.getElementById('listaVendas');
  const lista = filtroData ? vendas.filter(v => v.data === filtroData) : vendas;
  if (lista.length === 0) {
    div.innerHTML = '<div class="vazio">Nenhuma venda ainda</div>';
    return;
  }
  div.innerHTML = '';
  lista.forEach((v, i) => {
    let itensTexto = '';
    for (const nome in v.itens) {
      itensTexto += nome + ' x' + v.itens[nome].qtd + '  ';
    }
    div.innerHTML += `
      <div class="linha">
        <div>
          <strong>${v.dataStr} ${v.hora}</strong> — ${v.cliente}<br>
          <small>${itensTexto}</small><br>
          <strong style="color:#D4AF37">R$ ${v.total.toFixed(2)}</strong>
        </div>
        <button class="btn-vermelho" style="padding:3px 6px;" onclick="apagarVenda(${v.id})">✕</button>
      </div>
    `;
  });
}
</script>

</body>
</html>
