<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOJA CAOS 77 — Painel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

:root{
  --bg-dark: #0A0F1A;
  --bg-card: #0F1726;
  --azul: #00D4FF;
  --verde: #00FF88;
  --vermelho: #FF5252;
  --texto: #E5E7EB;
}

body{
  background:var(--bg-dark);
  min-height:100vh;
  color:var(--texto);
  padding:20px;
}

.container{max-width:900px;margin:0 auto;}

header{text-align:center;margin-bottom:25px;}
header h1{font-size:24px;background:linear-gradient(90deg,var(--azul),var(--verde));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.senha-tela{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:var(--bg-dark);display:flex;align-items:center;justify-content:center;z-index:999;
}
.senha-box{background:var(--bg-card);padding:40px 30px;border-radius:16px;width:90%;max-width:360px;text-align:center;}
.senha-box h2{margin-bottom:24px;color:var(--azul);}
.senha-box input{width:100%;padding:14px;border-radius:8px;border:1px solid #374151;background:rgba(30,30,30,0.6);color:white;font-size:16px;margin-bottom:16px;text-align:center;}
.senha-box button{width:100%;padding:14px;border-radius:8px;border:none;background:linear-gradient(90deg,var(--azul),#009ed6);color:white;font-size:16px;font-weight:600;cursor:pointer;}

.botoes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.btn{border:none;padding:14px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;}
.btn-salvar{background:linear-gradient(90deg,var(--verde),#00c56c);color:black;}
.btn-link{background:linear-gradient(90deg,var(--azul),#009ed6);color:white;}
.btn-sair{background:var(--vermelho);color:white;padding:10px 16px;border:none;border-radius:8px;font-weight:600;cursor:pointer;margin-bottom:15px;}

.card{background:var(--bg-card);border-radius:14px;padding:22px;margin-bottom:20px;border:1px solid rgba(255,255,255,0.05);}
.card h2{font-size:15px;margin-bottom:15px;color:#94A3B8;}

.caixas{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:20px;}
.caixa{background:rgba(0,0,0,0.25);padding:15px;border-radius:10px;text-align:center;}
.caixa label{font-size:12px;color:#94A3B8;display:block;margin-bottom:8px;}
.caixa input{width:100%;background:rgba(30,30,30,0.6);border:1px solid #374151;color:white;padding:10px;border-radius:6px;font-size:18px;font-weight:700;text-align:center;}

table{width:100%;border-collapse:collapse;margin-bottom:10px;}
th{text-align:left;padding:10px;color:#94A3B8;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.08);}
td{padding:8px;border-bottom:1px solid rgba(255,255,255,0.05);}
td input{width:100%;background:rgba(30,30,30,0.6);border:1px solid #374151;color:white;padding:6px 8px;border-radius:4px;font-size:14px;}

.linha-membro{display:flex;align-items:center;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,0.05);flex-wrap:wrap;gap:4px;}
.nome-membro{flex:1;min-width:150px;font-size:14px;}
.meta-membro{color:#94A3B8;font-size:13px;width:50px;text-align:center;}
.bolinha{cursor:pointer;font-size:20px;user-select:none;}

.oculto{display:none !important;}
.sucesso{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--verde);color:black;padding:12px 24px;border-radius:8px;font-weight:600;z-index:100;opacity:0;transition:opacity 0.3s;}
.sucesso.mostrar{opacity:1;}
</style>
</head>
<body>

<div class="senha-tela" id="telaSenha">
  <div class="senha-box">
    <h2>⚡ LOJA CAOS 77</h2>
    <input type="password" id="senhaInput" placeholder="Senha de Admin">
    <button onclick="entrar()">🔐 ENTRAR</button>
  </div>
</div>

<div class="sucesso" id="aviso">✅ SALVO E ATUALIZADO!</div>

<div id="conteudo" class="oculto">
  <div class="container">
    <header><h1>⚡ LOJA CAOS 77 — PAINEL DE CONTROLE</h1></header>
    
    <button class="btn-sair" style="float:right;" onclick="sair()">🚪 SAIR</button>
    <div style="clear:both;"></div>
    
    <div class="botoes">
      <button class="btn btn-salvar" onclick="salvar()">💾 SALVAR ALTERAÇÕES</button>
      <button class="btn btn-link" onclick="copiarLink()">🔗 COPIAR LINK DE VISITANTE</button>
    </div>
    
    <div class="caixas">
      <div class="caixa">
        <label>🏦 CAIXA DA FACÇÃO</label>
        <input type="text" id="caixaFac">
      </div>
      <div class="caixa">
        <label>💵 CAIXA DE PAGAMENTO</label>
        <input type="text" id="caixaPag">
      </div>
    </div>
    
    <div class="card">
      <h2>💎 TABELA DE VALORES — FRAGMENTOS</h2>
      <table>
        <thead><tr><th>Quantidade</th><th>Valor</th></tr></thead>
        <tbody id="corpoValores"></tbody>
      </table>
    </div>
    
    <div class="card">
      <h2>👥 CONTROLE DE FARM — COLABORADORES</h2>
      <div style="display:flex;gap:10px;font-size:12px;color:#94A3B8;margin-bottom:12px;">
        <span>🔴 Não cumprida</span><span>🟡 Parcial</span><span>🟢 Cumprida</span>
      </div>
      <div style="display:flex;padding:8px 4px 10px 4px;border-bottom:1px solid rgba(255,255,255,0.08);font-size:12px;color:#94A3B8;">
        <div style="flex:1;min-width:150px;">COLABORADOR</div>
        <div style="width:50px;text-align:center;">META</div>
        <div style="width:32px;text-align:center;">1</div>
        <div style="width:32px;text-align:center;">2</div>
        <div style="width:32px;text-align:center;">3</div>
        <div style="width:32px;text-align:center;">4</div>
        <div style="width:32px;text-align:center;">5</div>
        <div style="width:32px;text-align:center;">6</div>
        <div style="width:32px;text-align:center;">7</div>
      </div>
      <div id="corpoMembros"></div>
    </div>
    
    <div class="card" style="text-align:center;font-size:13px;color:#94A3B8;">
      📱 Link de visitante: <span id="linkVisitante" style="color:var(--azul);word-break:break-all;"></span>
    </div>
  </div>
</div>

<script>
const SENHA = '123477';
const emojis = {vazia:'', vermelha:'🔴', amarela:'🟡', verde:'🟢'};
const ordem = ['vazia','vermelha','amarela','verde'];
const CHAVE = 'lojaCaos77Dados';

let dados = {
  caixaFac: 'R$ 4.500.000,00',
  caixaPag: 'R$ 15.094.522,00',
  valores: [
    {qtd: '250 Fragmentos', valor: 'R$ 550,00'},
    {qtd: '1.250 Fragmentos', valor: 'R$ 2.500kk'},
    {qtd: '2.500 Fragmentos', valor: 'R$ 5.500kk'},
    {qtd: '3.750 Fragmentos', valor: 'R$ 8.500kk'}
  ],
  membros: [
    {nome: 'Sr Bristow', meta: '240', dias: ['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome: 'Katy Bristow', meta: '240', dias: ['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome: 'Andres Bristow', meta: '240', dias: ['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome: 'Ferrari Bristow', meta: '240', dias: ['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome: 'Vn Bristow', meta: '240', dias: ['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome: 'Patrik Bristow', meta: '240', dias: ['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome: 'Garcia Bristow', meta: '240', dias: ['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome: 'Vt Bristow', meta: '240', dias: ['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome: 'Lula Bristow', meta: '240', dias: ['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome: 'Breck Bristow', meta: '240', dias: ['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome: 'Boladin Xt', meta: '240', dias: ['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome: 'Sr Ghostt', meta: '240', dias: ['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome: 'Laa Diabla', meta: '240', dias: ['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome: 'Ejuan Handi', meta: '240', dias: ['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome: 'Eduarda Faria', meta: '240', dias: ['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome: 'Mateus Faria', meta: '240', dias: ['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome: 'Zé Bagaceira', meta: '240', dias: ['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome: 'Alex Gadernal', meta: '240', dias: ['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome: 'Aquino Menezes', meta: '240', dias: ['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome: 'Connorr', meta: '240', dias: ['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome: 'Dyygeras', meta: '240', dias: ['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome: 'Lanterna Preta', meta: '240', dias: ['vazia','vazia','vazia','vazia','vazia','vazia','vazia']}
  ],
  ultimaAtualizacao: ''
};

const LINK_ATUAL = window.location.href.replace('painel.html','');
const LINK_VISITANTE = LINK_ATUAL + 'painel.html#visitante';
document.getElementById('linkVisitante').textContent = LINK_VISITANTE;

function entrar(){
  if(document.getElementById('senhaInput').value === SENHA){
    document.getElementById('telaSenha').classList.add('oculto');
    document.getElementById('conteudo').classList.remove('oculto');
    carregar();
  }
}

function sair(){
  document.getElementById('conteudo').classList.add('oculto');
  document.getElementById('telaSenha').classList.remove('oculto');
  document.getElementById('senhaInput').value = '';
}

function carregar(){
  const salvo = localStorage.getItem(CHAVE);
  if(salvo) dados = JSON.parse(salvo);
  
  document.getElementById('caixaFac').value = dados.caixaFac;
  document.getElementById('caixaPag').value = dados.caixaPag;
  
  renderValores();
  renderMembros();
}

function salvar(){
  dados.caixaFac = document.getElementById('caixaFac').value;
  dados.caixaPag = document.getElementById('caixaPag').value;
  dados.ultimaAtualizacao = new Date().toLocaleString('pt-BR');
  localStorage.setItem(CHAVE, JSON.stringify(dados));
  
  const aviso = document.getElementById('aviso');
  aviso.classList.add('mostrar');
  setTimeout(()=>aviso.classList.remove('mostrar'), 2500);
}

function renderValores(){
  const corpo = document.getElementById('corpoValores');
  corpo.innerHTML = '';
  dados.valores.forEach((v,i)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><input value="${v.qtd}" oninput="dados.valores[${i}].qtd=this.value"></td><td><input value="${v.valor}" oninput="dados.valores[${i}].valor=this.value"></td>`;
    corpo.appendChild(tr);
  });
}

function renderMembros(){
  const corpo = document.getElementById('corpoMembros');
  corpo.innerHTML = '';
  dados.membros.forEach((m,idx)=>{
    const linha = document.createElement('div');
    linha.className = 'linha-membro';
    let b = '';
    for(let i=0;i<7;i++) b += `<div class="bolinha" onclick="trocar(${idx},${i})">${emojis[m.dias[i]]}</div>`;
    linha.innerHTML = `
      <div class="nome-membro">${m.nome}</div>
      <div class="meta-membro"><input style="width:40px;text-align:center;" value="${m.meta}" oninput="dados.membros[${idx}].meta=this.value"></div>
      ${b}
    `;
    corpo.appendChild(linha);
  });
}

function trocar(idx, dia){
  const a = dados.membros[idx].dias[dia];
  const p = ordem.indexOf(a);
  dados.membros[idx].dias[dia] = ordem[(p+1)%ordem.length];
  renderMembros();
}

function copiarLink(){
  navigator.clipboard.writeText(LINK_VISITANTE);
  const aviso = document.getElementById('aviso');
  aviso.textContent = '🔗 LINK COPIADO!';
  aviso.classList.add('mostrar');
  setTimeout(()=>{aviso.classList.remove('mostrar');aviso.textContent='✅ SALVO E ATUALIZADO!';},2500);
}

// MODO VISITANTE
if(window.location.hash === '#visitante'){
  setTimeout(()=>{
    document.getElementById('telaSenha').classList.add('oculto');
    document.getElementById('conteudo').classList.remove('oculto');
    document.querySelector('.botoes').innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#94A3B8;padding:15px;">🔄 Atualizado em tempo real — clique em atualizar página para ver mudanças</div>';
    document.querySelector('.btn-sair').style.display = 'none';
    carregar();
    
    // Bloquear edição
    setTimeout(()=>{
      document.querySelectorAll('input, .bolinha').forEach(el=>{
        el.style.pointerEvents = 'none';
        el.style.opacity = el.classList.contains('bolinha') ? '1' : '0.7';
      });
    }, 100);
  }, 100);
}

document.getElementById('senhaInput').addEventListener('keypress',e=>e.key==='Enter'&&entrar());
</script>

</body>
</html>
