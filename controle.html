<!-- 📊 TABELA DE VENDAS DE FRAGMENTOS -->
<div class="sales-card">
  <h2>💰 VENDAS DE FRAGMENTOS — SEMANA</h2>
  <table class="sales-table">
    <thead>
      <tr>
        <th>DIA</th>
        <th>FRAGMENTOS VENDIDOS</th>
        <th>VALOR (R$)</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="dia">Segunda</td>
        <td><input type="number" id="frag_seg" placeholder="0" oninput="atualizarVendas()"></td>
        <td><input type="number" id="val_seg" placeholder="0,00" oninput="atualizarVendas()"></td>
      </tr>
      <tr>
        <td class="dia">Terça</td>
        <td><input type="number" id="frag_ter" placeholder="0" oninput="atualizarVendas()"></td>
        <td><input type="number" id="val_ter" placeholder="0,00" oninput="atualizarVendas()"></td>
      </tr>
      <tr>
        <td class="dia">Quarta</td>
        <td><input type="number" id="frag_qua" placeholder="0" oninput="atualizarVendas()"></td>
        <td><input type="number" id="val_qua" placeholder="0,00" oninput="atualizarVendas()"></td>
      </tr>
      <tr>
        <td class="dia">Quinta</td>
        <td><input type="number" id="frag_qui" placeholder="0" oninput="atualizarVendas()"></td>
        <td><input type="number" id="val_qui" placeholder="0,00" oninput="atualizarVendas()"></td>
      </tr>
      <tr>
        <td class="dia">Sexta</td>
        <td><input type="number" id="frag_sex" placeholder="0" oninput="atualizarVendas()"></td>
        <td><input type="number" id="val_sex" placeholder="0,00" oninput="atualizarVendas()"></td>
      </tr>
      <tr>
        <td class="dia">Sábado</td>
        <td><input type="number" id="frag_sab" placeholder="0" oninput="atualizarVendas()"></td>
        <td><input type="number" id="val_sab" placeholder="0,00" oninput="atualizarVendas()"></td>
      </tr>
      <tr class="total-row">
        <td colspan="2">TOTAL DA SEMANA 💰</td>
        <td id="totalVendas">R$ 0,00</td>
      </tr>
    </tbody>
  </table>
  <button class="btn-add" style="margin-top:16px;padding:12px;font-size:14px;width:auto;" onclick="salvarVendas()">💾 SALVAR VENDAS</button>
</div>
