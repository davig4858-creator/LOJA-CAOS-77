<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAINEL DE CONTROLE — LOJA CAOS 77</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

:root{
  --bg-dark: #0A0F1A;
  --bg-card: #0F1726;
  --bg-card-hover: #172338;
  --azul: #00D4FF;
  --verde: #00FF88;
  --vermelho: #FF3B3B;
  --amarelo: #FFC107;
  --texto: #E0E6ED;
  --texto-sec: #8A9AB8;
}

body{
  background:var(--bg-dark);
  min-height:100vh;color:var(--texto);padding:0;margin:0;
  background-image: 
    linear-gradient(rgba(0,212,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.02) 1px, transparent 1px);
  background-size:25px 25px;
}

.header-top{
  background:linear-gradient(180deg, rgba(15,23,38,0.95), rgba(10,15,26,0.9));
  padding:18px 20px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(0,212,255,0.1);position:sticky;top:0;z-index:100;
  backdrop-filter:blur(10px);
}

.header-top .title{font-size:20px;font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:10px;}
.header-top .title span{color:var(--azul);}
.status-badge{
  background:rgba(0,255,136,0.1);color:var(--verde);padding:6px 14px;border-radius:20px;
  font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;border:1px solid rgba(0,255,136,0.2);
}
.status-badge::before{content:'';width:8px;height:8px;background:var(--verde);border-radius:50%;animation:pulse-green 2s infinite;}
@keyframes pulse-green{0%,100%{opacity:1;}50%{opacity:0.4;}}

.container{max-width:800px;margin:0 auto;padding:25px 20px;}

.search-bar{
  width:100%;padding:14px 18px;background:var(--bg-card);border:1px solid rgba(0,212,255,0.15);
  border-radius:10px;color:var(--texto);font-size:15px;margin-bottom:20px;outline:none;
}
.search-bar:focus{border-color:var(--azul);}
.search-bar::placeholder{color:var(--texto-sec);}

.btn-add{
  width:100%;padding:16px;background:linear-gradient(90deg,#00B8E6,#00D4FF);border:none;
  border-radius:10px;color:#000;font-size:16px;font-weight:800;cursor:pointer;
  margin-bottom:25px;transition:all 0.2s ease;box-shadow:0 0 20px rgba(0,212,255,0.25);
}
.btn-add:hover{transform:translateY(-2px);}

.table-header{
  display:grid;grid-template-columns:60px 1fr 100px 160px;gap:10px;
  padding:14px 16px;color:var(--azul);font-size:13px;font-weight:700;text-transform:uppercase;
  letter-spacing:1px;border-bottom:1px solid rgba(0,212,255,0.15);margin-bottom:8px;
}

.row{
  display:grid;grid-template-columns:60px 1fr 100px 160px;gap:10px;
  padding:16px;border-radius:10px;background:var(--bg-card);margin-bottom:10px;
  align-items:center;border:1px solid transparent;transition:all 0.2s ease;
}
.row:hover{background:var(--bg-card-hover);border-color:rgba(0,212,255,0.15);}

.status-dots{display:flex;gap:4px;}
.dot{width:14px;height:14px;border-radius:50%;}
.dot.green{background:var(--verde);box-shadow:0 0 6px var(--verde);}
.dot.red{background:var(--vermelho);box-shadow:0 0 6px var(--vermelho);}
.dot.yellow{background:var(--amarelo);box-shadow:0 0 6px var(--amarelo);}

.name{font-size:16px;font-weight:700;color:var(--texto);}
.tag{font-size:18px;text-align:center;}
.tag .crown{filter:drop-shadow(0 0 4px gold);}

.btn-edit{
  padding:8px 14px;background:linear-gradient(135deg,#1A3A5C,#244B7A);border:none;
  border-radius:6px;color:var(--azul);font-size:13px;font-weight:700;cursor:pointer;
  transition:all 0.2s ease;margin-right:6px;
}
.btn-del{
  padding:8px 14px;background:linear-gradient(135deg,#5C1A1A,#7A2424);border:none;
  border-radius:6px;color:#FF6B6B;font-size:13px;font-weight:700;cursor:pointer;
  transition:all 0.2s ease;
}

.modal-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);
  display:none;justify-content:center;align-items:center;z-index:200;backdrop-filter:blur(6px);
}
.modal{
  background:var(--bg-card);border:1px solid rgba(0,212,255,0.2);border-radius:14px;padding:25px;
  width:90%;max-width:450px;
}
.modal h3{color:var(--azul);font-size:18px;margin-bottom:20px;}
.modal input, .modal select{
  width:100%;padding:12px 14px;background:rgba(0,0,0,0.3);border:1px solid rgba(0,212,255,0.15);
  border-radius:8px;color:var(--texto);font-size:15px;margin-bottom:12px;outline:none;
}
.modal input:focus, .modal select:focus{border-color:var(--azul);}
.modal-buttons{display:flex;gap:10px;margin-top:10px;}
.modal-btn-cancel{flex:1;padding:12px;background:#2A3A58;border:none;border-radius:8px;color:var(--texto);font-weight:700;cursor:pointer;}
.modal-btn-save{flex:1;padding:12px;background:linear-gradient(90deg,#00B8E6,#00D4FF);border:none;border-radius:8px;color:#000;font-weight:800;cursor:pointer;}

.stats-card{
  background:var(--bg-card);border:1px solid rgba(0,212,255,0.15);border-radius:12px;padding:22px;margin-bottom:25px;
}
.stats-card h2{color:var(--azul);font-size:15px;margin-bottom:18px;text-transform:uppercase;letter-spacing:1px;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;}
.stat-item{background:rgba(0,0,0,0.25);padding:16px;border-radius:8px;}
.stat-label{font-size:12px;color:var(--texto-sec);margin-bottom:6px;text-transform:uppercase;}
.stat-value{font-size:20px;font-weight:800;color:var(--texto);}
.stat-value input{background:transparent;border:none;color:inherit;font-size:inherit;width:100%;outline:none;}

@media(max-width:600px){
  .table-header,.row{grid-template-columns:50px 1fr 70px 120px;gap:6px;}
}
</style>
</head>
<body>

<div class="header-top">
  <div class="title">⚡ PAINEL DE CONTROLE <span>LOJA CAOS 77</span></div>
  <div class="status-badge">Sincronizado</div>
</div>

<div class="container">

<div class="stats-card">
  <h2>📊 DADOS GERAIS</h2>
  <div class="stats-grid">
    <div class="stat-item">
      <div class="stat-label">Farm do Dia</div>
      <div class="stat-value"><input type="text" id="farmDia" placeholder="0"></div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Mais Formou</div>
      <div class="stat-value"><input type="text" id="maisFormou" placeholder="—"></div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Caixa</div>
      <div class="stat-value" style="color:#00FF88;"><input type="text" id="caixa" placeholder="R$ 0,00"></div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Estoque</div>
      <div class="stat-value" style="color:#00B8FF;"><input type="text" id="estoque" placeholder="0"></div>
    </div>
  </div>
  <button class="btn-add" style="margin-top:16px;padding:12px;font-size:14px;width:auto;" onclick="salvarDadosGerais()">💾 SALVAR DADOS</button>
</div>

<input type="text" class="search-bar" placeholder="🔍 Buscar por nome...">

<button class="btn-add" onclick="abrirModal()">+ ADICIONAR INTEGRANTE</button>

<div class="table-header">
  <div>STATUS</div>
  <div>NOME</div>
  <div>TAGS</div>
  <div>AÇÕES</div>
</div>

<div id="listaIntegrantes"></div>

</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitulo">➕ Adicionar Integrante</h3>
    <input type="text" id="inputNome" placeholder="Nome do integrante">
    <select id="inputStatus">
      <option value="online">🟢 Online</option>
      <option value="ausente">🟡 Ausente</option>
      <option value="offline">🔴 Offline</option>
    </select>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
      <input type="checkbox" id="inputCoroa" style="width:auto;margin:0;">
      <label for="inputCoroa" style="color:var(--texto);font-size:14px;">👑 Líder</label>
    </div>
    <div class="modal-buttons">
      <button class="modal-btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="modal-btn-save" onclick="salvarIntegrante()">Salvar</button>
    </div>
  </div>
</div>

<script>
let integrantes = JSON.parse(localStorage.getItem('integrantes')) || [
  {id:Date.now(),nome:'SRR MESQUITA',status:'online',coroa:true},
  {id:Date.now()+1,nome:'DOMM ED',status:'online',coroa:true},
  {id:Date.now()+2,nome:'ALOK MESQUITA',status:'online',coroa:false},
  {id:Date.now()+3,nome:'JAMES MECFERSON',status:'offline',coroa:false},
  {id:Date.now()+4,nome:'SR BIGODEK',status:'ausente',coroa:false},
];
let editId = null;

window.onload = function(){
  carregarDadosGerais();
  renderLista();
};

function carregarDadosGerais(){
  document.getElementById('farmDia').value = localStorage.getItem('farmDia') || '';
  document.getElementById('maisFormou').value = localStorage.getItem('maisFormou') || '';
  document.getElementById('caixa').value = localStorage.getItem('caixa') || '';
  document.getElementById('estoque').value = localStorage.getItem('estoque') || '';
}

function salvarDadosGerais(){
  localStorage.setItem('farmDia', document.getElementById('farmDia').value);
  localStorage.setItem('maisFormou', document.getElementById('maisFormou').value);
  localStorage.setItem('caixa', document.getElementById('caixa').value);
  localStorage.setItem('estoque', document.getElementById('estoque').value);
  alert('✅ Dados gerais salvos!');
}

function renderLista(){
  const container = document.getElementById('listaIntegrantes');
  container.innerHTML = '';
  
  integrantes.forEach(i=>{
    const statusClass = i.status === 'online' ? 'green' : i.status === 'ausente' ? 'yellow' : 'red';
    container.innerHTML += `
      <div class="row">
        <div class="status-dots"><div class="dot ${statusClass}"></div><div class="dot green"></div></div>
        <div class="name">${i.nome}</div>
        <div class="tag">${i.coroa ? '<span class="crown">👑</span>' : ''}</div>
        <div style="display:flex;gap:4px;">
          <button class="btn-edit" onclick="editar(${i.id})">EDITAR</button>
          <button class="btn-del" onclick="excluir(${i.id})">EXONERAR</button>
        </div>
      </div>
    `;
  });
  localStorage.setItem('integrantes', JSON.stringify(integrantes));
}

function abrirModal(){
  editId = null;
  document.getElementById('modalTitulo').textContent = '➕ Adicionar Integrante';
  document.getElementById('inputNome').value = '';
  document.getElementById('inputStatus').value = 'online';
  document.getElementById('inputCoroa').checked = false;
  document.getElementById('modal').style.display = 'flex';
}

function fecharModal(){
  document.getElementById('modal').style.display = 'none';
}

function editar(id){
  const i = integrantes.find(x=>x.id===id);
  if(!i)return;
  editId = id;
  document.getElementById('modalTitulo').textContent = '✏️ Editar Integrante';
  document.getElementById('inputNome').value = i.nome;
  document.getElementById('inputStatus').value = i.status;
  document.getElementById('inputCoroa').checked = i.coroa;
  document.getElementById('modal').style.display = 'flex';
}

function salvarIntegrante(){
  const nome = document.getElementById('inputNome').value.trim();
  const status = document.getElementById('inputStatus').value;
  const coroa = document.getElementById('inputCoroa').checked;
  if(!nome){alert('Digite o nome!');return;}
  
  if(editId){
    const idx = integrantes.findIndex(x=>x.id===editId);
    integrantes[idx] = {id:editId,nome,status,coroa};
  }else{
    integrantes.push({id:Date.now(),nome,status,coroa});
  }
  fecharModal();
  renderLista();
}

function excluir(id){
  if(confirm('Tem certeza? Isso não pode ser desfeito!')){
    integrantes = integrantes.filter(x=>x.id!==id);
    renderLista();
  }
}
</script>
</body>
</html>
