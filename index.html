<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOJA CAOS 77 — Controle de Farm</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="tela-login" class="tela-login">
    <div class="caixa-login">
        <h2>🔥 LOJA CAOS 77</h2>
        <p class="subtitulo">Controle de Farm & Caixa</p>
        <input type="text" id="usuario" placeholder="Usuário">
        <input type="password" id="senha" placeholder="Senha">
        <button onclick="fazerLogin()">ENTRAR</button>
        <p id="erro-login"></p>
    </div>
</div>

<div id="conteudo" class="conteudo" style="display: none;">
    <header>
        <h1>🔥 LOJA CAOS 77 — CONTROLE</h1>
        <button class="btn-sair" onclick="sair()">Sair</button>
    </header>

    <div class="painel-valores">
        <div class="card caixa">
            <h3>💰 CAIXA DA FACÇÃO</h3>
            <p class="valor-grande" id="valor-caixa">R$ 0,00</p>
            <button onclick="alterarCaixa()">Editar Caixa</button>
        </div>
        <div class="card fragmentos">
            <h3>💎 VALOR DO FRAGMENTO</h3>
            <p class="valor-grande" id="valor-fragmento">R$ 0,00</p>
            <button onclick="alterarFragmento()">Editar Valor</button>
        </div>
        <div class="card total-farms">
            <h3>👥 FARMADORES ATIVOS</h3>
            <p class="valor-grande" id="total-farmadores">0</p>
        </div>
    </div>

    <div class="acoes">
        <button class="btn-add" onclick="adicionarFarmador()">➕ Adicionar Farmador</button>
        <button class="btn-relatorio" onclick="gerarRelatorio()">📄 Gerar Relatório</button>
    </div>

    <h2>📋 Lista de Farmadores</h2>
    <div id="lista-farmadores" class="lista-farmadores"></div>

    <h2 style="margin-top: 3rem;">📄 Relatórios</h2>
    <div id="lista-relatorios"></div>
</div>

<script src="script.js"></script>
</body>
</html>
