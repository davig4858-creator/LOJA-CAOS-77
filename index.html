<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOJA CAOS 77</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#0a0a0a;color:#fff;padding:20px;min-height:100vh;}
.container{max-width:900px;margin:0 auto;}

/* LOGIN */
.login{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a0a;display:flex;justify-content:center;align-items:center;z-index:999;}
.caixa-login{background:#1a1a1a;padding:40px;border-radius:16px;width:90%;max-width:360px;text-align:center;border:1px solid #333;}
.caixa-login h1{font-size:24px;color:#00d4ff;margin-bottom:20px;}
input{width:100%;padding:12px;background:#222;border:1px solid #444;border-radius:8px;color:#fff;font-size:15px;margin-bottom:12px;outline:none;}
.btn-admin{width:100%;padding:12px;background:#00d4ff;border:none;border-radius:8px;color:#000;font-weight:bold;cursor:pointer;margin-bottom:8px;}
.btn-visita{width:100%;padding:12px;background:transparent;border:1px solid #666;border-radius:8px;color:#aaa;cursor:pointer;}
.erro{color:#ff4444;margin-top:10px;display:none;}

/* CONTEÚDO */
.topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.topo h1{font-size:22px;color:#00d4ff;}
.badge{padding:6px 12px;border-radius:20px;font-size:12px;background:#00d4ff20;color:#00d4ff;}
.btn-sair{padding:8px 14px;background:#ff444420;border:none;border-radius:6px;color:#ff6666;cursor:pointer;}

/* CAIXAS */
.caixas{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.caixas.uma{grid-template-columns:1fr;}
.caixa{background:#1a1a1a;padding:16px;border-radius:12px;text-align:center;border:1px solid #333;}
.caixa.escondida{display:none;}
.caixa label{font-size:12px;color:#888;margin-bottom:6px;display:block;}
.caixa input{font-size:18px;font-weight:bold;text-align:center;}

/* TABELAS */
.bloco{background:#1a1a1a;padding:16px;border-radius:12px;margin-bottom:20px;border:1px solid #333;}
.bloco h2{font-size:15px;margin-bottom:12px;color:#00d4ff;}
table{width:100%;border-collapse:collapse;}
th,td{padding:10px;text-align:left;border-bottom:1px solid #333;}
th{font-size:12px;color:#00d4ff;}
td input{margin:0;}
.btn-add{padding:8px 14px;background:#00d4ff;border:none;border-radius:6px;color:#000;font-weight:bold;cursor:pointer;margin-top:10px;}
.btn-del{padding:5px 8px;background:#ff444420;border:none;border-radius:4px;color:#ff6666;cursor:pointer;}

/* NOMES E METAS */
.cabeca{display:grid;grid-template-columns:160px 50px repeat(7,40px) 40px;gap:4px;margin-bottom:6px;}
.cabeca div{font-size:10px;text-align:center;color:#00d4ff;}
.linha{display:grid;grid-template-columns:160px 50px repeat(7,40px) 40px;gap:4px;align-items:center;padding:4px 0;border-bottom:1px solid #222;}
.nome{background:transparent;border:none;color:#fff;font-size:14px;outline:none;}
.meta{width:100%;background:#222;border:1px solid #444;border-radius:4px;color:#ffcc00;text-align:center;padding:4px;}
.bolinha{width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;background:#222;font-size:14px;}
.bolinha.verde{background:#10b981;}
.bolinha.amarela{background:#f59e0b;}
.bolinha.vermelha{background:#ef4444;}

@media(max-width:600px){
  .caixas{grid-template-columns:1fr;}
  .cabeca,.linha{grid-template-columns:120px 45px repeat(7,32px) 35px;}
  .bolinha{width:26px;height:26px;font-size:11px;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="telaLogin">
  <div class="caixa-login">
    <h1>⚡ LOJA CAOS 77</h1>
    <input type="password" id="senha" placeholder="Senha de Admin">
    <button class="btn-admin" onclick="entrarAdmin()">🔐 ENTRAR COMO ADMIN</button>
    <button class="btn-visita" onclick="entrarVisitante()">👀 ENTRAR COMO VISITANTE</button>
    <div class="erro" id="erro">Senha incorreta!</div>
    <p style="margin-top:15px;font-size:12px;color:#666;">Admin: 123477</p>
  </div>
</div>

<!-- CONTEÚDO -->
<div class="container" id="conteudo" style="display:none;">
  <div class="topo">
    <h1>⚡ CONTROLE</h1>
    <div style="display:flex;gap:10px;align-items:center;">
      <span class="badge" id="tipo">Visitante</span>
      <button class="btn-sair" onclick="sair()">Sair</button>
    </div>
  </div>

  <!-- CAIXAS -->
  <div class="caixas" id="gridCaixas">
    <div class="caixa escondida" id="facBloco">
      <label>🏦 CAIXA DA FACÇÃO</label>
      <input type="text" id="caixaFac" value="R$ 0,00">
    </div>
    <div class="caixa escondida" id="liderBloco">
      <label>👑 CAIXA DO LÍDER</label>
      <input type="text" id="caixaLider" value="R$ 0,00">
    </div>
    <div class="caixa" id="pagBloco">
      <label>💵 CAIXA DE PAGAMENTO</label>
      <input type="text" id="caixaPag" value="R$ 0,00">
    </div>
  </div>

  <!-- TABELA DE PREÇOS -->
  <div class="bloco">
    <h2>📊 TABELA DE PREÇOS</h2>
    <table>
      <thead><tr><th>ITEM</th><th>VALOR</th><th></th></tr></thead>
      <tbody id="precosCorpo">
        <tr data-id="1">
          <td><input type="text" value="Fragmento de Cristal"></td>
          <td><input type="text" value="R$ 1,50"></td>
          <td><button class="btn-del" onclick="removerPreco(1)">✖</button></td>
        </tr>
      </tbody>
    </table>
    <button class="btn-add" onclick="adicionarPreco()">➕ ADICIONAR</button>
  </div>

  <!-- NOMES E METAS -->
  <div class="bloco">
    <h2>👥 COLABORADORES — META: 120</h2>
    <div class="cabeca">
      <div>NOME</div><div>META</div>
      <div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div>
      <div>✖</div>
    </div>
    <div id="nomesCorpo"></div>
    <button class="btn-add" onclick="adicionarLinha()">➕ ADICIONAR</button>
  </div>
</div>

<script>
const SENHA = '123477';
let ADMIN = false, idPreco = 2, idLinha = 1;
const cores = ['', 'verde', 'amarela', 'vermelha'];
const emojis = {verde:'🟢', amarela:'🟡', vermelha:'🔴'};

// LOGIN
function entrarAdmin(){
  if(document.getElementById('senha').value === SENHA){
    localStorage.setItem('caos77', 'admin');
    iniciar();
  }else{
    document.getElementById('erro').style.display = 'block';
    setTimeout(()=>document.getElementById('erro').style.display='none',2500);
  }
}
function entrarVisitante(){
  localStorage.setItem('caos77', 'visitante');
  iniciar();
}
function sair(){
  localStorage.removeItem('caos77');
  location.reload();
}
document.getElementById('senha').addEventListener('keypress',e=>e.key==='Enter'&&entrarAdmin());

// INICIAR
function iniciar(){
  const tipo = localStorage.getItem('caos77');
  if(!tipo) return;
  ADMIN = tipo === 'admin';
  
  document.getElementById('telaLogin').style.display = 'none';
  document.getElementById('conteudo').style.display = 'block';
  document.getElementById('tipo').textContent = ADMIN ? '👑 ADMIN' : '👀 VISITANTE';
  
  if(ADMIN){
    document.getElementById('facBloco').classList.remove('escondida');
    document.getElementById('liderBloco').classList.remove('escondida');
  }else{
    document.getElementById('gridCaixas').classList.add('uma');
  }
  
  const todos = document.querySelectorAll('input, button');
  todos.forEach(el=>{if(!ADMIN && el.type!=='password' && !el.classList.contains('btn-sair')) el.disabled = true;});
  
  carregar();
  adicionarLinha(); adicionarLinha();
}

// PREÇOS
function adicionarPreco(){
  const tr = document.createElement('tr');
  tr.dataset.id = idPreco;
  tr.innerHTML = '<td><input type="text" placeholder="Item"></td><td><input type="text" placeholder="R$ 0,00"></td><td><button class="btn-del" onclick="removerPreco('+idPreco+')">✖</button></td>';
  document.getElementById('precosCorpo').appendChild(tr);
  idPreco++;
  salvar();
}
function removerPreco(id){document.querySelector(`tr[data-id="${id}"]`)?.remove();salvar();}

// LINHAS
function adicionarLinha(){
  const div = document.createElement('div');
  div.className = 'linha';
  div.dataset.id = idLinha;
  div.innerHTML = `
    <input type="text" class="nome" placeholder="Nome">
    <input type="text" class="meta" value="120">
    <button class="bolinha" onclick="trocar(this)"></button>
    <button class="bolinha" onclick="trocar(this)"></button>
    <button class="bolinha" onclick="trocar(this)"></button>
    <button class="bolinha" onclick="trocar(this)"></button>
    <button class="bolinha" onclick="trocar(this)"></button>
    <button class="bolinha" onclick="trocar(this)"></button>
    <button class="bolinha" onclick="trocar(this)"></button>
    <button class="btn-del" onclick="removerLinha(${idLinha})">✖</button>
  `;
  document.getElementById('nomesCorpo').appendChild(div);
  idLinha++;
  salvar();
}
function trocar(btn){
  let i = cores.indexOf(btn.dataset.cor || '');
  i = (i + 1) % cores.length;
  btn.dataset.cor = cores[i];
  btn.className = 'bolinha ' + cores[i];
  btn.textContent = emojis[cores[i]] || '';
  salvar();
}
function removerLinha(id){document.querySelector(`.linha[data-id="${id}"]`)?.remove();salvar();}

// SALVAR/CARREGAR
function salvar(){
  if(!ADMIN) return;
  const dados = {
    fac: document.getElementById('caixaFac').value,
    lider: document.getElementById('caixaLider').value,
    pag: document.getElementById('caixaPag').value,
    precos: [...document.querySelectorAll('#precosCorpo tr')].map(tr=>({
      n: tr.querySelector('td:first-child input').value,
      v: tr.querySelector('td:nth-child(2) input').value
    })),
    nomes: [...document.querySelectorAll('#nomesCorpo .linha')].map(div=>({
      n: div.querySelector('.nome').value,
      m: div.querySelector('.meta').value,
      d: [...div.querySelectorAll('.bolinha')].map(b=>b.dataset.cor||'')
    }))
  };
  localStorage.setItem('caos77dados', JSON.stringify(dados));
}
function carregar(){
  const s = localStorage.getItem('caos77dados');
  if(!s) return;
  try{
    const d = JSON.parse(s);
    if(ADMIN){
      document.getElementById('caixaFac').value = d.fac || 'R$ 0,00';
      document.getElementById('caixaLider').value = d.lider || 'R$ 0,00';
    }
    document.getElementById('caixaPag').value = d.pag || 'R$ 0,00';
    
    document.getElementById('precosCorpo').innerHTML = '';
    (d.precos||[]).forEach(p=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><input type="text" value="${p.n}"></td><td><input type="text" value="${p.v}"></td><td><button class="btn-del" onclick="this.parentElement.parentElement.remove()">✖</button></td>`;
      document.getElementById('precosCorpo').appendChild(tr);
    });
    
    document.getElementById('nomesCorpo').innerHTML = '';
    (d.nomes||[]).forEach(m=>{
      const div = document.createElement('div');
      div.className = 'linha';
      let dias = '';
      for(let c of m.d||['','','','','','','']){
        dias += `<button class="bolinha ${c}" data-cor="${c}" onclick="trocar(this)">${emojis[c]||''}</button>`;
      }
      div.innerHTML = `<input type="text" class="nome" value="${m.n}"><input type="text" class="meta" value="${m.m}">${dias}<button class="btn-del" onclick="this.parentElement.remove()">✖</button>`;
      document.getElementById('nomesCorpo').appendChild(div);
    });
  }catch(e){}
}

if(localStorage.getItem('caos77')) iniciar();
</script>

</body>
</html>
