/* DK HAMBURGUERIA — AJUSTE VISUAL APENAS
   Cole este CSS no FINAL do bloco <style> que já existe no index.html.
   Não altera HTML, JavaScript, cadastro, pedidos ou salvamento. */

:root{
  --dk-bg:#100d16;
  --dk-surface:#1b1625;
  --dk-surface-2:#241d30;
  --dk-border:#3b2e4d;
  --dk-purple:#7c3aed;
  --dk-purple-dark:#4c1d95;
  --dk-gold:#f5c451;
  --dk-text:#faf7ff;
  --dk-muted:#b9aec9;
  --dk-green:#55d99a;
  --dk-red:#ff7182;
}

*{box-sizing:border-box}
body{
  background:
    radial-gradient(ellipse at 90% 0%,#30194a 0,transparent 35%),
    var(--dk-bg)!important;
  color:var(--dk-text)!important;
  min-height:100vh;
  padding:clamp(12px,2.5vw,28px)!important;
  line-height:1.5;
}
.topo{
  max-width:1180px;
  margin:0 auto 22px!important;
  padding:clamp(22px,4vw,34px)!important;
  border:1px solid #b78a35!important;
  border-radius:20px!important;
  background:linear-gradient(125deg,#21122f 0%,#40206b 55%,#29143e 100%)!important;
  box-shadow:0 16px 38px #0005!important;
}
.topo h1{
  color:var(--dk-gold)!important;
  font-size:clamp(24px,4vw,36px)!important;
  letter-spacing:1.2px;
  text-shadow:none!important;
}
.abas{
  max-width:1180px;
  margin:0 auto 12px!important;
  gap:10px!important;
}
.botaoAba{
  border:1px solid var(--dk-border)!important;
  border-radius:12px!important;
  padding:14px 16px!important;
  background:var(--dk-surface)!important;
  color:var(--dk-muted)!important;
  box-shadow:none!important;
}
.botaoAba.ativa{
  background:linear-gradient(135deg,#f7d36f,#e4ad37)!important;
  color:#211707!important;
  border-color:#e8bd55!important;
  box-shadow:0 7px 18px #d4af3725!important;
}
.conteudoAba{
  max-width:1180px;
  margin:0 auto 18px!important;
  padding:clamp(15px,2.5vw,26px)!important;
  background:linear-gradient(145deg,#1b1625,#17121f)!important;
  border:1px solid var(--dk-border)!important;
  border-radius:16px!important;
  box-shadow:0 14px 34px #0004!important;
}
h2{
  color:var(--dk-gold)!important;
  font-size:clamp(20px,2.5vw,26px)!important;
  margin:0 0 16px!important;
  letter-spacing:-.3px;
}
h3{
  color:#eee5ff;
  font-size:16px;
  margin:24px 0 10px!important;
}
input{
  width:100%;
  padding:13px 14px!important;
  border:1px solid var(--dk-border)!important;
  border-radius:11px!important;
  background:#120e19!important;
  color:var(--dk-text)!important;
  margin:7px 0!important;
  font-size:15px;
  outline:none;
  transition:border-color .15s,box-shadow .15s;
}
input::placeholder{color:#8f849f}
input:focus{
  border-color:var(--dk-purple)!important;
  box-shadow:0 0 0 3px #7c3aed22!important;
}
.botao{
  padding:13px 15px!important;
  border-radius:11px!important;
  font-size:14px!important;
  font-weight:750!important;
  margin:6px 0!important;
  box-shadow:none!important;
  transition:filter .15s,transform .15s;
}
.botao:hover{filter:brightness(1.08);transform:translateY(-1px)}
.botaoDourado{
  background:linear-gradient(135deg,#f7d36f,#e5ad36)!important;
  color:#241907!important;
}
.botaoVerde{
  background:#235c43!important;
  color:#eafff2!important;
  border:1px solid #347b59!important;
}
.botaoVermelho{
  background:#572735!important;
  color:#ffdce1!important;
  border:1px solid #783746!important;
}
.botaoMais,.botaoMenos{
  width:38px!important;
  height:38px!important;
  min-width:38px;
  border-radius:11px!important;
  font-size:21px!important;
  box-shadow:none!important;
}
.botaoMais{background:#245a43!important;color:#bff8d8!important}
.botaoMenos{background:#5b2935!important;color:#ffd5dc!important}
.item{
  background:linear-gradient(135deg,#211a2d,#1b1525)!important;
  border:1px solid var(--dk-border)!important;
  border-radius:13px!important;
  padding:14px 15px!important;
  margin:9px 0!important;
  gap:12px!important;
  box-shadow:0 5px 16px #0002;
}
.item>span{font-weight:650;line-height:1.4}
.quantidadeItem{
  background:#120e19!important;
  border:1px solid var(--dk-border)!important;
  border-radius:9px!important;
  padding:7px 12px!important;
  min-width:38px!important;
  color:var(--dk-gold);
}
.botoesQuantidade{gap:8px!important}
.totalDia{
  background:linear-gradient(135deg,#281b38,#1b1427)!important;
  border:1px solid #9a742d!important;
  border-radius:14px!important;
  padding:18px!important;
  margin:18px 0!important;
  color:var(--dk-gold)!important;
  font-size:clamp(17px,2.5vw,22px)!important;
  box-shadow:inset 0 1px #ffffff08;
}
.historicoPedido{
  background:#15101e!important;
  border:1px solid var(--dk-border)!important;
  border-radius:13px!important;
  padding:16px!important;
  margin:12px 0!important;
  line-height:1.75;
}
.aviso{
  background:#251b35!important;
  border:1px solid #4c356c!important;
  border-radius:11px!important;
  padding:13px 15px!important;
  margin:14px 0!important;
  color:#d9c9f3!important;
  line-height:1.5;
}
/* A área do painel fica centralizada e confortável em telas grandes. */
#listaLanchesPedido,#itensDoPedido,#historicoPedidos,#listaLanchesCadastrados{
  display:block;
}
/* Ajustes para tablet e celular */
@media(max-width:700px){
  body{padding:10px!important}
  .topo{padding:22px 14px!important;margin-bottom:14px!important;border-radius:16px!important}
  .topo h1{font-size:25px!important;letter-spacing:.6px}
  .abas{gap:7px!important}
  .botaoAba{padding:12px 8px!important;font-size:13px;line-height:1.25}
  .conteudoAba{padding:14px!important;border-radius:13px!important}
  h3{margin-top:20px!important}
  .item{align-items:center!important;padding:12px!important}
  .item>span{flex:1;min-width:130px}
  .botoesQuantidade{flex-shrink:0}
  .botao{font-size:13px!important;padding:12px 10px!important}
}
@media(max-width:420px){
  .abas{flex-direction:column}
  .botaoAba{width:100%;border-radius:10px!important}
  .topo h1{font-size:22px!important}
  .item{gap:8px!important}
  .botaoMais,.botaoMenos{width:34px!important;height:34px!important;min-width:34px}
  .quantidadeItem{min-width:32px!important;padding:6px 8px!important}
}
