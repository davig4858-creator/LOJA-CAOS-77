<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOJA CAOS 77 — Painel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
:root{--bg:#0A0F1A;--card:#0F1726;--azul:#00D4FF;--verde:#00FF88;--verm:#FF5252;--amar:#FFD700;--roxo:#8B5CF6;--txt:#E5E7EB;}
body{background:var(--bg);color:var(--txt);padding:15px;min-height:100vh;}
.container{max-width:100%;margin:0 auto;}
header{text-align:center;margin-bottom:20px;}
header h1{font-size:20px;color:var(--azul);}

.senha-tela{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;}
.senha-box{background:var(--card);padding:40px 30px;border-radius:16px;width:90%;max-width:360px;text-align:center;}
.senha-box h2{margin-bottom:20px;color:var(--azul);}
.senha-box input{width:100%;padding:14px;border-radius:8px;border:1px solid #374151;background:#1e1e1e;color:white;font-size:16px;margin-bottom:16px;text-align:center;}
.senha-box button{width:100%;padding:14px;border-radius:8px;border:none;background:var(--azul);color:white;font-size:16px;font-weight:bold;cursor:pointer;}

.botoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px;}
.btn{border:none;padding:12px;border-radius:10px;font-size:14px;font-weight:bold;cursor:pointer;}
.btn-salvar{background:var(--verde);color:black;}
.btn-link{background:var(--azul);color:white;}
.btn-add{background:var(--roxo);color:white;padding:10px 16px;border-radius:8px;border:none;font-weight:bold;cursor:pointer;margin-bottom:15px;font-size:14px;}
.btn-del{background:var(--verm);color:white;padding:4px 8px;border-radius:4px;border:none;font-size:11px;cursor:pointer;}
.btn-sair{background:var(--verm);color:white;padding:10px 16px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-bottom:15px;float:right;}

.card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:15px;border:1px solid #222;}
.card h2{font-size:14px;margin-bottom:12px;color:#94A3B8;}

.caixas{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:15px;}
.caixa{background:#1a1a1a;padding:12px;border-radius:10px;text-align:center;}
.caixa label{font-size:11px;color:#94A3B8;margin-bottom:6px;display:block;}
.caixa input{width:100%;background:#1e1e1e;border:1px solid #333;color:white;padding:8px;border-radius:6px;font-size:16px;font-weight:bold;text-align:center;}

table{width:100%;border-collapse:collapse;margin-bottom:8px;}
th{text-align:left;padding:8px;color:#94A3B8;font-size:12px;border-bottom:1px solid #222;}
td{padding:6px;border-bottom:1px solid #222;}
td input{width:100%;background:#1e1e1e;border:1px solid #333;color:white;padding:5px 6px;border-radius:4px;font-size:13px;}

.linha-cab{display:flex;padding:6px 4px 10px 4px;border-bottom:1px solid #222;font-size:11px;color:#94A3B8;font-weight:bold;flex-wrap:nowrap;}
.c-nome{width:160px;flex-shrink:0;}
.c-meta{width:55px;text-align:center;flex-shrink:0;}
.c-dia{width:36px;text-align:center;flex-shrink:0;}
.c-acao{width:50px;text-align:center;flex-shrink:0;}

.bloco-membro{padding:8px 4px;border-bottom:1px solid #222;}
.linha-f1,.linha-f2{display:flex;align-items:center;flex-wrap:nowrap;}
.linha-f1{margin-bottom:4px;}
.linha-f2{padding-left:215px;}
.espaco-f2{width:215px;flex-shrink:0;}

.nome-membro{width:160px;flex-shrink:0;font-size:13px;}
.nome-membro input{width:100%;background:#1e1e1e;border:1px solid transparent;color:white;padding:5px 6px;border-radius:4px;font-size:13px;}
.meta-membro{width:55px;text-align:center;flex-shrink:0;}
.meta-membro input{width:100%;background:#1e1e1e;border:1px solid transparent;color:white;padding:5px 2px;border-radius:4px;font-size:13px;text-align:center;}
.bolinha{width:34px;height:34px;border-radius:6px;border:none;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;background:#2a2a2a;flex-shrink:0;transition:all .15s;}
.b-vazia{background:#2a2a2a;}
.b-verm{background:var(--verm);}
.b-amar{background:var(--amar);color:black;}
.b-verd{background:var(--verde);color:black;}

.legenda{display:flex;gap:15px;font-size:12px;color:#94A3B8;margin-bottom:12px;flex-wrap:wrap;}
.legenda span{display:flex;align-items:center;gap:4px;}
.legenda span::before{content:'';width:14px;height:14px;border-radius:3px;}
.legenda span:nth-child(1)::before{background:var(--verm);}
.legenda span:nth-child(2)::before{background:var(--amar);}
.legenda span:nth-child(3)::before{background:var(--verde);}

.oculto{display:none !important;}
.aviso{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--verde);color:black;padding:12px 24px;border-radius:8px;font-weight:bold;z-index:100;opacity:0;transition:opacity .3s;}
.aviso.mostrar{opacity:1;}
</style>
</head>
<body>

<div class="senha-tela" id="telaSenha">
  <div class="senha-box">
    <h2>⚡ LOJA CAOS 77</h2>
    <input type="password" id="senhaInput" placeholder="Senha de Admin">
    <button onclick="entrar()">🔐 ENTRAR</button>
  </div>
</div>

<div class="aviso" id="aviso">✅ SALVO!</div>

<div id="conteudo" class="oculto">
  <div class="container">
    <header><h1>⚡ LOJA CAOS 77 — PAINEL DE CONTROLE</h1></header>
    
    <button class="btn-sair" onclick="sair()">🚪 SAIR</button>
    <div style="clear:both;"></div>
    
    <div class="botoes">
      <button class="btn btn-salvar" onclick="salvar()">💾 SALVAR</button>
      <button class="btn btn-link" onclick="copiarLink()">🔗 LINK VISITANTE</button>
    </div>
    
    <div class="caixas">
      <div class="caixa">
        <label>🏦 CAIXA DA FACÇÃO</label>
        <input type="text" id="caixaFac" value="R$ 5.000.000,00">
      </div>
      <div class="caixa">
        <label>💵 CAIXA DE PAGAMENTO</label>
        <input type="text" id="caixaPag" value="R$ 18.214.502,00">
      </div>
    </div>
    
    <div class="card">
      <h2>💎 TABELA DE VALORES — FRAGMENTOS</h2>
      <table><thead><tr><th>Quantidade</th><th>Valor</th></tr></thead><tbody id="corpoValores">
        <tr><td><input value="250 Fragmentos" oninput="dados.valores[0].qtd=this.value"></td><td><input value="R$ 550,00" oninput="dados.valores[0].valor=this.value"></td></tr>
        <tr><td><input value="1.250 Fragmentos" oninput="dados.valores[1].qtd=this.value"></td><td><input value="R$ 3.600k" oninput="dados.valores[1].valor=this.value"></td></tr>
        <tr><td><input value="2.500 Fragmentos" oninput="dados.valores[2].qtd=this.value"></td><td><input value="R$ 7.000k" oninput="dados.valores[2].valor=this.value"></td></tr>
        <tr><td><input value="3.750 Fragmentos" oninput="dados.valores[3].qtd=this.value"></td><td><input value="R$ 10.550k" oninput="dados.valores[3].valor=this.value"></td></tr>
      </tbody></table>
    </div>
    
    <div class="card">
      <h2>👥 CONTROLE DE FARM — COLABORADORES</h2>
      <button class="btn-add" onclick="adicionarMembro()">➕ ADICIONAR MEMBRO</button>
      
      <div class="legenda">
        <span>🔴 Não cumprida</span>
        <span>🟡 Parcial</span>
        <span>🟢 Cumprida</span>
      </div>
      
      <div class="linha-cab">
        <div class="c-nome">COLABORADOR</div>
        <div class="c-meta">META</div>
        <div class="c-dia">1</div><div class="c-dia">2</div><div class="c-dia">3</div>
        <div class="c-dia">4</div><div class="c-dia">5</div><div class="c-dia">6</div><div class="c-dia">7</div>
        <div class="c-acao"></div>
      </div>
      <div class="linha-cab" style="border:none;padding-top:0;">
        <div class="espaco-f2"></div>
        <div class="c-dia">1</div><div class="c-dia">2</div><div class="c-dia">3</div>
        <div class="c-dia">4</div><div class="c-dia">5</div><div class="c-dia">6</div><div class="c-dia">7</div>
      </div>
      
      <div id="corpoMembros"></div>
    </div>
    
    <div class="card" style="text-align:center;font-size:13px;color:#94A3B8;">
      📱 Link de visitante: <span id="linkVisitante" style="color:var(--azul);word-break:break-all;"></span>
    </div>
  </div>
</div>

<script>
const SENHA = '123477';
const ESTADOS = ['vazia','verm','amar','verd'];
const CHAVE = 'lojaCaos77Dados';

let dados = {
  caixaFac: 'R$ 5.000.000,00',
  caixaPag: 'R$ 18.214.502,00',
  valores: [
    {qtd:'250 Fragmentos',valor:'R$ 550,00'},
    {qtd:'1.250 Fragmentos',valor:'R$ 3.600k'},
    {qtd:'2.500 Fragmentos',valor:'R$ 7.000k'},
    {qtd:'3.750 Fragmentos',valor:'R$ 10.550k'}
  ],
  membros: [
    {nome:'Sr Bristow',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome:'Katy Bristow',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome:'Andres Bristow',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome:'Ferrari Bristow',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome:'Vn Bristow',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome:'Patrik Bristow',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome:'Garcia Bristow',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome:'Vt Bristow',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome:'Lula Bristow',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome:'Breck Bristow',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome:'Boladin Xt',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome:'Sr Ghostt',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome:'Laa Diabla',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome:'Ejuan Handi',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome:'Eduarda Faria',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome:'Mateus Faria',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome:'Zé Bagaceira',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome:'Alex Gadernal',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome:'Aquino Menezes',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome:'Connorr Dyygeras',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome:'Lanterna Preta',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome:'Lewandowski Silva',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']},
    {nome:'Sr Luizsr',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']}
  ]
};

const LINK_ATUAL = window.location.href.split('#')[0];
const LINK_VISITANTE = LINK_ATUAL + '#visitante';
document.getElementById('linkVisitante').textContent = LINK_VISITANTE;

function entrar(){
  if(document.getElementById('senhaInput').value === SENHA){
    document.getElementById('telaSenha').classList.add('oculto');
    document.getElementById('conteudo').classList.remove('oculto');
    carregar();
  }
}
function sair(){
  document.getElementById('conteudo').classList.add('oculto');
  document.getElementById('telaSenha').classList.remove('oculto');
  document.getElementById('senhaInput').value = '';
}
function carregar(){
  const s = localStorage.getItem(CHAVE);
  if(s) dados = JSON.parse(s);
  document.getElementById('caixaFac').value = dados.caixaFac;
  document.getElementById('caixaPag').value = dados.caixaPag;
  renderMembros();
}
function salvar(){
  dados.caixaFac = document.getElementById('caixaFac').value;
  dados.caixaPag = document.getElementById('caixaPag').value;
  localStorage.setItem(CHAVE, JSON.stringify(dados));
  const a = document.getElementById('aviso');
  a.classList.add('mostrar');
  setTimeout(()=>a.classList.remove('mostrar'),2500);
}
function renderMembros(){
  const c = document.getElementById('corpoMembros');
  c.innerHTML = '';
  dados.membros.forEach((m,idx)=>{
    const b = document.createElement('div');
    b.className = 'bloco-membro';
    let d1='',d2='';
    for(let i=0;i<7;i++){
      const e1=m.dias1[i],e2=m.dias2[i];
      const em1=e1=='verd'?'🟢':e1=='amar'?'🟡':e1=='verm'?'🔴':'';
      const em2=e2=='verd'?'🟢':e2=='amar'?'🟡':e2=='verm'?'🔴':'';
      d1+=`<button class="bolinha b-${e1}" onclick="mudar(${idx},1,${i})">${em1}</button>`;
      d2+=`<button class="bolinha b-${e2}" onclick="mudar(${idx},2,${i})">${em2}</button>`;
    }
    b.innerHTML = `
      <div class="linha-f1">
        <div class="nome-membro"><input value="${m.nome}" oninput="dados.membros[${idx}].nome=this.value"></div>
        <div class="meta-membro"><input value="${m.meta}" oninput="dados.membros[${idx}].meta=this.value"></div>
        ${d1}<button class="btn-del" onclick="remover(${idx})">🗑️</button>
      </div>
      <div class="linha-f2"><div class="espaco-f2"></div>${d2}</div>
    `;
    c.appendChild(b);
  });
}
function mudar(idx,f,d){
  const alvo = f==1?dados.membros[idx].dias1:dados.membros[idx].dias2;
  const a = ESTADOS.indexOf(alvo[d]);
  alvo[d] = ESTADOS[(a+1)%4];
  renderMembros();
}
function adicionarMembro(){
  dados.membros.push({nome:'Novo Membro',meta:'240',dias1:['vazia','vazia','vazia','vazia','vazia','vazia','vazia'],dias2:['vazia','vazia','vazia','vazia','vazia','vazia','vazia']});
  renderMembros();
  salvar();
  const a=document.getElementById('aviso');
  a.textContent='✅ MEMBRO ADICIONADO!';
  a.classList.add('mostrar');
  setTimeout(()=>{a.classList.remove('mostrar');a.textContent='✅ SALVO!';},2500);
}
function remover(idx){
  if(confirm('Remover este membro?')){
    dados.membros.splice(idx,1);
    renderMembros();
    salvar();
  }
}
function copiarLink(){
  navigator.clipboard.writeText(LINK_VISITANTE);
  const a=document.getElementById('aviso');
  a.textContent='🔗 LINK COPIADO!';
  a.classList.add('mostrar');
  setTimeout(()=>{a.classList.remove('mostrar');a.textContent='✅ SALVO!';},2500);
}
if(window.location.hash==='#visitante'){
  setTimeout(()=>{
    document.getElementById('telaSenha').classList.add('oculto');
    document.getElementById('conteudo').classList.remove('oculto');
    document.querySelector('.botoes').innerHTML='<div style="padding:15px;text-align:center;color:#94A3B8;">👀 Modo visualização — atualize a página para ver mudanças</div>';
    document.querySelector('.btn-sair').style.display='none';
    document.querySelector('.btn-add').style.display='none';
    carregar();
    setTimeout(()=>{
      document.querySelectorAll('input,button').forEach(e=>{
        e.style.pointerEvents='none';
        if(!e.classList.contains('bolinha')) e.style.opacity='0.7';
      });
    },100);
  },100);
}
document.getElementById('senhaInput').addEventListener('keypress',e=>e.key==='Enter'&&entrar());
</script>
</body>
</html>
